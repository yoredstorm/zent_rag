# =============================================================================
# RAG-as-a-Service Platform — Infraestructura Completa de Observabilidad
# =============================================================================
# Stack: FastAPI + PostgreSQL + Qdrant + Redis + LiteLLM
# Observabilidad (PLG): Prometheus + Loki + Promtail + Grafana
# =============================================================================

version: "3.9"

x-common-env: &common-env
  TZ: ${TZ:-America/Lima}
  RAG_ENVIRONMENT: ${ENVIRONMENT:-development}
  # Pydantic Settings usa prefijo RAG_ (ver src/config.py)
  RAG_POSTGRES_HOST: postgres
  RAG_POSTGRES_PORT: "5432"
  RAG_POSTGRES_USER: ${POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
  RAG_POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
  RAG_QDRANT_HOST: qdrant
  RAG_QDRANT_PORT: "6333"
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-me}
  RAG_REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:-}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:-}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  RAG_LITELLM_TIMEOUT_SECONDS: ${RAG_LITELLM_TIMEOUT_SECONDS:-60}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_VECTOR_DIMENSION: ${RAG_VECTOR_DIMENSION:-1024}
  RAG_RAG_TOP_K: ${RAG_RAG_TOP_K:-5}
  RAG_RAG_SCORE_THRESHOLD: ${RAG_RAG_SCORE_THRESHOLD:-0.0}
  RAG_RAG_CONVERSATION_TTL_SECONDS: ${RAG_RAG_CONVERSATION_TTL_SECONDS:-3600}
  RAG_RAG_SQL_EXPERT_ENABLED: ${RAG_RAG_SQL_EXPERT_ENABLED:-false}
  RAG_RAG_SQL_TIMEOUT_SECONDS: ${RAG_RAG_SQL_TIMEOUT_SECONDS:-5}
  RAG_SQL_HEURISTICS_MODULES: ${RAG_SQL_HEURISTICS_MODULES:-}
  RAG_GOLDEN_SET_PATH: ${RAG_GOLDEN_SET_PATH:-}
  RAG_RAG_MAX_CONTEXT_TOKENS: ${RAG_RAG_MAX_CONTEXT_TOKENS:-32000}
  RAG_RAG_LAZY_INGESTION_ENABLED: ${RAG_RAG_LAZY_INGESTION_ENABLED:-false}
  RAG_RAG_LAZY_INGEST_MAX_ROWS_PER_TABLE: ${RAG_RAG_LAZY_INGEST_MAX_ROWS_PER_TABLE:-25}
  RAG_RAG_LAZY_INGEST_MAX_TABLES: ${RAG_RAG_LAZY_INGEST_MAX_TABLES:-5}
  RAG_RAG_LAZY_INGEST_TIMEOUT_SECONDS: ${RAG_RAG_LAZY_INGEST_TIMEOUT_SECONDS:-4}
  RAG_RAG_LAZY_INGEST_PROMOTE_THRESHOLD: ${RAG_RAG_LAZY_INGEST_PROMOTE_THRESHOLD:-10}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  RAG_INGEST_EMBED_BATCH_SIZE: ${RAG_INGEST_EMBED_BATCH_SIZE:-64}
  RAG_INGEST_EMBED_CONCURRENCY: ${RAG_INGEST_EMBED_CONCURRENCY:-8}
  RAG_INGEST_TABLE_CONCURRENCY: ${RAG_INGEST_TABLE_CONCURRENCY:-3}
  RAG_INGEST_UPSERT_BATCH_SIZE: ${RAG_INGEST_UPSERT_BATCH_SIZE:-100}
  RAG_INGEST_SKIP_TABLES: ${RAG_INGEST_SKIP_TABLES-sales,product_reviews,inventory}
  RAG_INGEST_MAX_ROWS_PER_TABLE: ${RAG_INGEST_MAX_ROWS_PER_TABLE:-0}
  RAG_QDRANT_TIMEOUT_SECONDS: ${RAG_QDRANT_TIMEOUT_SECONDS:-60}
  RAG_QDRANT_UPSERT_CONCURRENCY: ${RAG_QDRANT_UPSERT_CONCURRENCY:-2}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  RAG_PORTAL_SESSION_TTL_HOURS: ${RAG_PORTAL_SESSION_TTL_HOURS:-24}
  RAG_AUTH_LOGIN_MAX_ATTEMPTS: ${RAG_AUTH_LOGIN_MAX_ATTEMPTS:-5}
  RAG_AUTH_LOGIN_WINDOW_SECONDS: ${RAG_AUTH_LOGIN_WINDOW_SECONDS:-900}
  RAG_PORTAL_DEV_PASSWORD: ${RAG_PORTAL_DEV_PASSWORD:-demo-password-change-me}
  RAG_PORTAL_DEV_EMAIL: ${RAG_PORTAL_DEV_EMAIL:-demo@zenttech.com}
  RAG_VAULT_ADDR: ${VAULT_ADDR:-}
  RAG_VAULT_TOKEN: ${VAULT_TOKEN:-}
  RAG_LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RAG_METRICS_TOKEN: ${METRICS_TOKEN:-rag-metrics-scrape-token}
  RAG_RATE_LIMIT_ENABLED: ${RAG_RATE_LIMIT_ENABLED:-true}
  RAG_RATE_LIMIT_PER_ORGANIZATION_MINUTE: ${RAG_RATE_LIMIT_PER_ORGANIZATION_MINUTE:-600}
  RAG_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  OLLAMA_API_BASE: http://ollama:11434

services:
  # ===========================================================================
  # API Gateway — FastAPI
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    labels:
      - "promtail.scrape=true"
      - "promtail.job=rag-api"

  # ===========================================================================
  # Portal B2B — UI organization (reemplaza web-tester)
  # ===========================================================================
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: rag-portal
    ports:
      - "${PORTAL_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Ingestion Worker — Procesa cola de ingesta (Redis) independiente de la API
  # ===========================================================================
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag-ingestion-worker
    # Migrations run in the API container only; worker just consumes the Redis queue.
    command: ["python", "worker_entry.py"]
    # Image HEALTHCHECK hits /health (API); worker has no HTTP server.
    healthcheck:
      disable: true
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    labels:
      - "promtail.scrape=true"
      - "promtail.job=rag-ingestion-worker"

  # ===========================================================================
  # Ollama — Embeddings locales (bge-m3, CPU)
  # ===========================================================================
  ollama:
    image: ollama/ollama:0.6.5
    container_name: rag-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # PostgreSQL — Base Relacional (Organizations, Usuarios, Facturación)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      # Solo loopback del host: Postgres NO debe quedar expuesto a la red.
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
      # Seeds demo (token admin dev) SOLO si se pide explícitamente
      RAG_SEED_DEMO_DATA: ${RAG_SEED_DEMO_DATA:-true}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_platform}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Qdrant — Base de Datos Vectorial (Embeddings, RAG Context)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: rag-qdrant
    ports:
      # Solo loopback del host
      - "127.0.0.1:${QDRANT_EXPOSE_REST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_EXPOSE_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-me}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Redis — Caché y Cola de Tareas
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      # Solo loopback del host
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:6379"
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-dev-redis-password-change-me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dev-redis-password-change-me} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Prometheus — Recolección de Métricas
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rag-prometheus
    ports:
      # Solo loopback del host
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Loki — Agregación Centralizada de Logs
  # ===========================================================================
  loki:
    image: grafana/loki:3.2.0
    container_name: rag-loki
    ports:
      # Solo loopback del host
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Promtail — Agente de Recolección de Logs (envía a Loki)
  # ===========================================================================
  promtail:
    image: grafana/promtail:3.2.0
    container_name: rag-promtail
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      # Read-only: promtail solo necesita descubrir contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Grafana — Dashboards de Observabilidad
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: rag-grafana
    ports:
      # Solo loopback del host
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-dev-insecure-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./config/grafana/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - rag-network

# =============================================================================
# Volúmenes Persistentes
# =============================================================================
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  ollama_data:
  prometheus_data:
  loki_data:
  grafana_data:

# =============================================================================
# Red Docker Interna — Comunicación entre servicios
# =============================================================================
networks:
  rag-network:
    driver: bridge
