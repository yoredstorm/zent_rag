  # off bloquea /api/v1/cognitive/* (503). Requiere las migraciones 102-108
  # (el API las aplica al arrancar: alembic upgrade head).
  RAG_COGNITIVE_OS_ENABLED: ${RAG_COGNITIVE_OS_ENABLED:-off}
