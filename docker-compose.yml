# =============================================================================
# RAG-as-a-Service Platform — Infraestructura Completa de Observabilidad
# =============================================================================
# Stack: FastAPI + PostgreSQL + Qdrant + Redis + LiteLLM
# Observabilidad (PLG): Prometheus + Loki + Promtail + Grafana
# =============================================================================

version: "3.9"

x-common-env: &common-env
  TZ: ${TZ:-America/Lima}
  RAG_ENVIRONMENT: ${ENVIRONMENT:-development}
  # Nada de datos demo: cada trial arranca con la base vacía. Con esto
  # `provision_demo_kb` no encola el schema compartido (ni en el alta de trial
  # ni en StartMode). Reencender con RAG_SEED_DEMO_DATA=true si se necesita.
  RAG_SEED_DEMO_DATA: ${RAG_SEED_DEMO_DATA:-false}
  # Cada trial re-embebe el dataset demo completo (schema farmacia) y con LLM en
  # CPU eso deja el worker ocupado minutos por alta. Apagado en dev: el demo
  # sigue disponible por StartMode ("Probar con datos de ejemplo").
  RAG_DEMO_PROVISION_ON_TRIAL: ${RAG_DEMO_PROVISION_ON_TRIAL:-false}
  # Pydantic Settings usa prefijo RAG_ (ver src/config.py)
  RAG_POSTGRES_HOST: postgres
  RAG_POSTGRES_PORT: "5432"
  RAG_POSTGRES_USER: ${POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
  RAG_POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
  # Read-only role para el SQL Expert (Text-to-SQL Engine)
  RAG_POSTGRES_READONLY_USER: rag_reader
  RAG_POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-readonly_change_me}
  RAG_QDRANT_HOST: qdrant
  RAG_QDRANT_PORT: "6333"
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-me}
  RAG_REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:-}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:-}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  RAG_LITELLM_TIMEOUT_SECONDS: ${RAG_LITELLM_TIMEOUT_SECONDS:-300}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_VECTOR_DIMENSION: ${RAG_VECTOR_DIMENSION:-1024}
  RAG_RAG_TOP_K: ${RAG_RAG_TOP_K:-5}
  RAG_RAG_SCORE_THRESHOLD: ${RAG_RAG_SCORE_THRESHOLD:-0.0}
  RAG_RAG_CONVERSATION_TTL_SECONDS: ${RAG_RAG_CONVERSATION_TTL_SECONDS:-3600}
  RAG_RAG_SQL_EXPERT_ENABLED: ${RAG_RAG_SQL_EXPERT_ENABLED:-false}
  RAG_RAG_SQL_TIMEOUT_SECONDS: ${RAG_RAG_SQL_TIMEOUT_SECONDS:-5}
  RAG_SQL_HEURISTICS_MODULES: ${RAG_SQL_HEURISTICS_MODULES:-}
  # Subida de archivos: 25 MB por archivo; el body HTTP lleva aire (32 MB).
  RAG_MAX_BODY_BYTES: ${RAG_MAX_BODY_BYTES:-33554432}
  RAG_GOLDEN_SET_PATH: ${RAG_GOLDEN_SET_PATH:-}
  # Evaluation Engine (golden sets, LLM-judge, regresión de versiones)
  RAG_EVAL_JUDGE_ENABLED: ${RAG_EVAL_JUDGE_ENABLED:-true}
  RAG_EVAL_JUDGE_MODEL: ${RAG_EVAL_JUDGE_MODEL:-gpt-4o-mini}
  RAG_EVAL_JUDGE_MAX_TOKENS: ${RAG_EVAL_JUDGE_MAX_TOKENS:-256}
  RAG_EVAL_DEFAULT_TOP_K: ${RAG_EVAL_DEFAULT_TOP_K:-200}
  RAG_EVAL_REGRESSION_QUALITY_MIN_DELTA: ${RAG_EVAL_REGRESSION_QUALITY_MIN_DELTA:--0.05}
  RAG_EVAL_REGRESSION_FAITHFULNESS_MIN_DELTA: ${RAG_EVAL_REGRESSION_FAITHFULNESS_MIN_DELTA:--0.10}
  RAG_EVAL_REGRESSION_HALLUCINATION_MAX_DELTA: ${RAG_EVAL_REGRESSION_HALLUCINATION_MAX_DELTA:-0.10}
  RAG_EVAL_REGRESSION_COST_MAX_INCREASE_PCT: ${RAG_EVAL_REGRESSION_COST_MAX_INCREASE_PCT:-10.0}
  RAG_EVAL_REGRESSION_LATENCY_MAX_INCREASE_PCT: ${RAG_EVAL_REGRESSION_LATENCY_MAX_INCREASE_PCT:-10.0}
  RAG_EVAL_REGRESSION_LATENCY_MAX_INCREASE_MS: ${RAG_EVAL_REGRESSION_LATENCY_MAX_INCREASE_MS:-200.0}
  RAG_RAG_MAX_CONTEXT_TOKENS: ${RAG_RAG_MAX_CONTEXT_TOKENS:-32000}
  RAG_RAG_LAZY_INGESTION_ENABLED: ${RAG_RAG_LAZY_INGESTION_ENABLED:-false}
  RAG_RAG_LAZY_INGEST_MAX_ROWS_PER_TABLE: ${RAG_RAG_LAZY_INGEST_MAX_ROWS_PER_TABLE:-25}
  RAG_RAG_LAZY_INGEST_MAX_TABLES: ${RAG_RAG_LAZY_INGEST_MAX_TABLES:-5}
  RAG_RAG_LAZY_INGEST_TIMEOUT_SECONDS: ${RAG_RAG_LAZY_INGEST_TIMEOUT_SECONDS:-4}
  RAG_RAG_LAZY_INGEST_PROMOTE_THRESHOLD: ${RAG_RAG_LAZY_INGEST_PROMOTE_THRESHOLD:-10}
  # Hybrid retrieval engine
  RAG_RAG_RETRIEVAL_STRATEGY: ${RAG_RAG_RETRIEVAL_STRATEGY:-vector}
  RAG_RAG_HYBRID_FUSION: ${RAG_RAG_HYBRID_FUSION:-rrf}
  RAG_RAG_RRF_K: ${RAG_RAG_RRF_K:-60}
  RAG_RAG_HYBRID_LEXICAL_WEIGHT: ${RAG_RAG_HYBRID_LEXICAL_WEIGHT:-0.3}
  RAG_RAG_RERANKER: ${RAG_RAG_RERANKER:-}
  RAG_RAG_CROSS_ENCODER_MODEL: ${RAG_RAG_CROSS_ENCODER_MODEL:-}
  RAG_RAG_SQL_MAX_ROWS: ${RAG_RAG_SQL_MAX_ROWS:-100}
  RAG_RAG_SQL_MAX_COST: ${RAG_RAG_SQL_MAX_COST:-100000}
  RAG_RAG_SQL_MAX_TABLES: ${RAG_RAG_SQL_MAX_TABLES:-8}
  RAG_RAG_SQL_ROUTER_THRESHOLD: ${RAG_RAG_SQL_ROUTER_THRESHOLD:-0.5}
  RAG_RAG_SQL_ROUTER_LLM_ENABLED: ${RAG_RAG_SQL_ROUTER_LLM_ENABLED:-true}
  # Agent Runtime
  RAG_RAG_AGENT_MODEL: ${RAG_RAG_AGENT_MODEL:-}
  RAG_RAG_AGENT_MAX_STEPS: ${RAG_RAG_AGENT_MAX_STEPS:-5}
  RAG_RAG_AGENT_TOOL_MODULES: ${RAG_RAG_AGENT_TOOL_MODULES:-src.verticals.demo_farmacia.tools}
  # MCP Server (Model Context Protocol) — Streamable HTTP en /mcp
  RAG_RAG_MCP_ENABLED: ${RAG_RAG_MCP_ENABLED:-true}
  # Host header allowlist (DNS-rebinding guard). Por defecto cubre acceso
  # directo al API (localhost:8000) y vía portal nginx (localhost:8080).
  RAG_RAG_MCP_ALLOWED_HOSTS: ${RAG_RAG_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,testserver}
  RAG_RAG_MCP_DEFAULT_RPM: ${RAG_RAG_MCP_DEFAULT_RPM:-60}
  # Connector Platform
  RAG_CONNECTOR_SECRETS_KEY: ${RAG_CONNECTOR_SECRETS_KEY:-zent-connector-secrets-dev-key-change-me}
  RAG_CONNECTOR_TEST_TIMEOUT_SECONDS: ${RAG_CONNECTOR_TEST_TIMEOUT_SECONDS:-10}
  RAG_CONNECTOR_PLUGIN_MODULES: ${RAG_CONNECTOR_PLUGIN_MODULES:-}
  # Universal API Connector + demo integrations: el contenedor api necesita
  # egress HTTPS (443) a pokeapi.co, api.open-meteo.com, geocoding-api.open-meteo.com
  # y jsonplaceholder.typicode.com (demos), y a las APIs que importe cada tenant.
  # SSRF check, allowlist, rate limits y timeout se aplican en runtime (marketplace).
  # Usage & Cost Engine
  RAG_USAGE_ENGINE_ENABLED: ${RAG_USAGE_ENGINE_ENABLED:-true}
  RAG_USAGE_COST_CURRENCY: ${RAG_USAGE_COST_CURRENCY:-USD}
  RAG_USAGE_QUOTA_MARGIN_TOKENS: ${RAG_USAGE_QUOTA_MARGIN_TOKENS:-1024}
  # Billing Platform
  RAG_PAYMENT_PROVIDER: ${RAG_PAYMENT_PROVIDER:-manual}
  RAG_BILLING_WEBHOOK_SECRET: ${RAG_BILLING_WEBHOOK_SECRET:-zent-billing-webhook-secret-change-me}
  RAG_BILLING_PAST_DUE_GRACE_DAYS: ${RAG_BILLING_PAST_DUE_GRACE_DAYS:-7}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  RAG_INGEST_EMBED_BATCH_SIZE: ${RAG_INGEST_EMBED_BATCH_SIZE:-64}
  RAG_INGEST_EMBED_CONCURRENCY: ${RAG_INGEST_EMBED_CONCURRENCY:-8}
  RAG_INGEST_TABLE_CONCURRENCY: ${RAG_INGEST_TABLE_CONCURRENCY:-3}
  RAG_INGEST_UPSERT_BATCH_SIZE: ${RAG_INGEST_UPSERT_BATCH_SIZE:-100}
  RAG_INGEST_SKIP_TABLES: ${RAG_INGEST_SKIP_TABLES-sales,product_reviews,inventory}
  RAG_INGEST_MAX_ROWS_PER_TABLE: ${RAG_INGEST_MAX_ROWS_PER_TABLE:-0}
  RAG_QDRANT_TIMEOUT_SECONDS: ${RAG_QDRANT_TIMEOUT_SECONDS:-60}
  RAG_QDRANT_UPSERT_CONCURRENCY: ${RAG_QDRANT_UPSERT_CONCURRENCY:-2}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  RAG_PORTAL_SESSION_TTL_HOURS: ${RAG_PORTAL_SESSION_TTL_HOURS:-24}
  RAG_AUTH_LOGIN_MAX_ATTEMPTS: ${RAG_AUTH_LOGIN_MAX_ATTEMPTS:-5}
  RAG_AUTH_LOGIN_WINDOW_SECONDS: ${RAG_AUTH_LOGIN_WINDOW_SECONDS:-900}
  RAG_PORTAL_DEV_PASSWORD: ${RAG_PORTAL_DEV_PASSWORD:-demo-password-change-me}
  RAG_PORTAL_DEV_EMAIL: ${RAG_PORTAL_DEV_EMAIL:-demo@zenttech.com}
  RAG_PLATFORM_ADMIN_EMAIL: ${RAG_PLATFORM_ADMIN_EMAIL:-admin@zent.dev}
  RAG_VAULT_ADDR: ${VAULT_ADDR:-}
  RAG_VAULT_TOKEN: ${VAULT_TOKEN:-}
  RAG_LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Phase 31C — customer DBs on the same cluster. Adapters rds/neon: NotImplementedError.
  RAG_MANAGED_DB_PROVIDER: ${RAG_MANAGED_DB_PROVIDER:-local}
  RAG_DEMO_SQL_SCHEMAS: ${RAG_DEMO_SQL_SCHEMAS:-farmacia}
  RAG_METRICS_TOKEN: ${METRICS_TOKEN:-rag-metrics-scrape-token}
  RAG_RATE_LIMIT_ENABLED: ${RAG_RATE_LIMIT_ENABLED:-true}
  RAG_RATE_LIMIT_PER_MINUTE: ${RAG_RATE_LIMIT_PER_MINUTE:-3000}
  RAG_RATE_LIMIT_PER_ORGANIZATION_MINUTE: ${RAG_RATE_LIMIT_PER_ORGANIZATION_MINUTE:-30000}
  RAG_RATE_LIMIT_PUBLIC_PER_MINUTE: ${RAG_RATE_LIMIT_PUBLIC_PER_MINUTE:-120}
  RAG_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  RAG_UPLOAD_DIR: /app/uploads
  # Embeddings locales (Ollama) DESACTIVADOS: se usa Novita AI (hosted).
  # Reactivar junto con el servicio `ollama` y RAG_EMBEDDING_MODEL=ollama/bge-m3.
  # OLLAMA_API_BASE: http://ollama:11434
  # =========================================================================
  # Knowledge V2 (Enterprise Knowledge Engine) — Flags de runtime
  # =========================================================================
  # Defaults productivos OFF (ADR: habilitar solo tras shadow metrics).
  # Para probar localmente activa en tu .env/shell:
  #   RAG_KNOWLEDGE_V2_ENABLED=true RAG_KNOWLEDGE_V2_PROMOTE=true
  RAG_KNOWLEDGE_V2_ENABLED: ${RAG_KNOWLEDGE_V2_ENABLED:-false}
  RAG_KNOWLEDGE_V2_PROMOTE: ${RAG_KNOWLEDGE_V2_PROMOTE:-false}
  RAG_KNOWLEDGE_V2_SHADOW: ${RAG_KNOWLEDGE_V2_SHADOW:-false}
  RAG_KNOWLEDGE_SUMMARY_MODE: ${RAG_KNOWLEDGE_SUMMARY_MODE:-off}
  RAG_KNOWLEDGE_SUMMARY_MODEL: ${RAG_KNOWLEDGE_SUMMARY_MODEL:-}
  RAG_KNOWLEDGE_LOCATE_LLM_ENABLED: ${RAG_KNOWLEDGE_LOCATE_LLM_ENABLED:-false}
  RAG_KNOWLEDGE_LOCATE_MODEL: ${RAG_KNOWLEDGE_LOCATE_MODEL:-}
  # -------------------------------------------------------------------------
  # Knowledge Tabular V2 (Excel/CSV): estructura + SQL-first + auto-ingesta.
  # Requiere RAG_KNOWLEDGE_V2_ENABLED=true para persistir/embeder (sin V2 queda
  # inerte; el conector Excel/CSV sigue con el camino V1 de siempre).
  # -------------------------------------------------------------------------
  RAG_KNOWLEDGE_TABULAR_ENABLED: ${RAG_KNOWLEDGE_TABULAR_ENABLED:-true}
  RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES: ${RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES:-52428800}
  RAG_KNOWLEDGE_TABULAR_MAX_SHEETS: ${RAG_KNOWLEDGE_TABULAR_MAX_SHEETS:-50}
  RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET: ${RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET:-100000}
  RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS: ${RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS:-512}
  RAG_KNOWLEDGE_TABULAR_MAX_CELLS: ${RAG_KNOWLEDGE_TABULAR_MAX_CELLS:-2000000}
  RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS: ${RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS:-5000}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE:-40}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP:-2}
