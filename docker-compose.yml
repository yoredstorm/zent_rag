  RAG_ADAPTIVE_RAG_TOP_K_COMPARE: ${RAG_ADAPTIVE_RAG_TOP_K_COMPARE:-8}
  RAG_ADAPTIVE_RAG_TOP_K_MULTI: ${RAG_ADAPTIVE_RAG_TOP_K_MULTI:-12}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE:-0.25}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE:-0.25}
