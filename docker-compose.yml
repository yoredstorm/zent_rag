  RAG_ADAPTIVE_RAG_FAST_PATH: ${RAG_ADAPTIVE_RAG_FAST_PATH:-true}
  RAG_ADAPTIVE_RAG_REWRITE: ${RAG_ADAPTIVE_RAG_REWRITE:-true}
  # Zent AI Runtime experiments (default off).
  RAG_RUNTIME_TOOL_ROUTING_MODE: ${RAG_RUNTIME_TOOL_ROUTING_MODE:-off}
  RAG_RUNTIME_TERMINATION_GATE: ${RAG_RUNTIME_TERMINATION_GATE:-off}
  RAG_RUNTIME_ANSWER_GATE: ${RAG_RUNTIME_ANSWER_GATE:-off}
  RAG_RUNTIME_JEV_STATE_MAX_CHARS: ${RAG_RUNTIME_JEV_STATE_MAX_CHARS:-30000}
  RAG_RUNTIME_JEV_TOOL_CONFIDENCE: ${RAG_RUNTIME_JEV_TOOL_CONFIDENCE:-0.60}
  RAG_RUNTIME_JEV_ANSWER_APPROVE: ${RAG_RUNTIME_JEV_ANSWER_APPROVE:-0.66}
  RAG_RUNTIME_JEV_ANSWER_REVISE: ${RAG_RUNTIME_JEV_ANSWER_REVISE:-0.40}
  RAG_RUNTIME_SHADOW_SAMPLE_RATE: ${RAG_RUNTIME_SHADOW_SAMPLE_RATE:-0}
  RAG_RUNTIME_SOURCE_AWARE_TOOLS: ${RAG_RUNTIME_SOURCE_AWARE_TOOLS:-true}
  RAG_RUNTIME_FAILED_TOOL_GUARD: ${RAG_RUNTIME_FAILED_TOOL_GUARD:-true}
  RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT:-0.40}
  RAG_RUNTIME_EFFICIENCY_COST_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_COST_WEIGHT:-0.25}
  RAG_RUNTIME_EFFICIENCY_LATENCY_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_LATENCY_WEIGHT:-0.20}
  RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT:-0.15}

services:
  # ===========================================================================
  # API Gateway — FastAPI
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Archivos subidos (Knowledge Platform) — persistentes entre deploys
      - uploads_data:/app/uploads
    environment:
      <<: *common-env
      # SDK in-container (docker compose exec api …). Desde el host usa localhost.
      ZENT_BASE_URL: http://127.0.0.1:8000/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    labels:
      - "promtail.scrape=true"
      - "promtail.job=rag-api"

  # ===========================================================================
  # Portal B2B — UI organization (reemplaza web-tester)
  # ===========================================================================
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: rag-portal
    ports:
      - "${PORTAL_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Ingestion Worker — Procesa cola de ingesta (Redis) independiente de la API
  # ===========================================================================
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rag-ingestion-worker
    # Migrations run in the API container only; worker just consumes the Redis queue.
    command: ["python", "worker_entry.py"]
    volumes:
      # Mismo volumen de uploads que la API (los conectores file/csv/excel leen de ahí)
      - uploads_data:/app/uploads
    # Image HEALTHCHECK hits /health (API); worker has no HTTP server.
    healthcheck:
      disable: true
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      # El API aplica `alembic upgrade head` al arrancar (incluida la 118 de
      # tabular_*): el worker espera a que esté healthy para no consumir jobs
      # de Excel/CSV antes de que existan las tablas tabulares.
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    labels:
      - "promtail.scrape=true"
      - "promtail.job=rag-ingestion-worker"

  # ===========================================================================
  # Ollama — Embeddings locales (bge-m3, CPU). DESACTIVADO: consume mucha RAM.
  # Embeddings ahora van a Novita AI (RAG_EMBEDDING_MODEL=openai/baai/bge-m3).
  # Para reactivar en un servidor potente:
  #   1. Descomenta este bloque y el volumen `ollama_data` del final.
  #   2. Descomenta `OLLAMA_API_BASE` en x-common-env y `ollama` en los
  #      depends_on de api/ingestion-worker.
  #   3. RAG_EMBEDDING_MODEL=ollama/bge-m3 y `docker compose up -d --build`.
  # ===========================================================================
  # ollama:
  #   image: ollama/ollama:0.6.5
  #   container_name: rag-ollama
  #   expose:
  #     - "11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=24h
  #   restart: unless-stopped
  #   networks:
  #     - rag-network
  #   healthcheck:
  #     test: ["CMD", "ollama", "ps"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3

  # ===========================================================================
  # PostgreSQL — Base Relacional (Organizations, Usuarios, Facturación)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      # Solo loopback del host: Postgres NO debe quedar expuesto a la red.
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-readonly_change_me}
      # Seeds demo (token admin dev) SOLO si se pide expl�citamente
      RAG_SEED_DEMO_DATA: ${RAG_SEED_DEMO_DATA:-false}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init solo en volumen vacío: SQL top-level 01–31 y 77–79 + scripts .sh.
      # Los espejos 32–86 viven en db_init/sql/ y las migraciones 087–114
      # (incl. 113 integration connector, 114 assistant inbox) se aplican con
      # `alembic upgrade head` al arrancar el contenedor api.
      # IMPORTANTE: en volúmenes existentes los scripts .sh de db_init NO se
      # re-ejecutan. Si el rol rag_reader no existe (09-readonly-role.sh), el
      # SQL Expert falla silenciosamente y responde vía RAG. Provisionar a
      # mano:
      #   docker exec rag-postgres bash /docker-entrypoint-initdb.d/09-readonly-role.sh
      #   docker exec rag-postgres bash /docker-entrypoint-initdb.d/80-managed-db-privileges.sh
      - ./src/infrastructure/db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_platform}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Qdrant — Base de Datos Vectorial (Embeddings, RAG Context)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: rag-qdrant
    ports:
      # Solo loopback del host
      - "127.0.0.1:${QDRANT_EXPOSE_REST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_EXPOSE_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-me}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Redis — Caché y Cola de Tareas
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      # Solo loopback del host
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:6379"
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-dev-redis-password-change-me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dev-redis-password-change-me} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Prometheus — Recolección de Métricas
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rag-prometheus
    ports:
      # Solo loopback del host
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Loki — Agregación Centralizada de Logs
  # ===========================================================================
  loki:
    image: grafana/loki:3.2.0
    container_name: rag-loki
    ports:
      # Solo loopback del host
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Promtail — Agente de Recolección de Logs (envía a Loki)
  # ===========================================================================
  promtail:
    image: grafana/promtail:3.2.0
    container_name: rag-promtail
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      # Read-only: promtail solo necesita descubrir contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    networks:
      - rag-network

  # ===========================================================================
  # Grafana — Dashboards de Observabilidad
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: rag-grafana
    ports:
      # Solo loopback del host
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-dev-insecure-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./config/grafana/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - rag-network

# =============================================================================
# Volúmenes Persistentes
# =============================================================================
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  uploads_data:
  ollama_data:
  prometheus_data:
  loki_data:
  grafana_data:

# =============================================================================
# Red Docker Interna — Comunicación entre servicios
# =============================================================================
networks:
  rag-network:
    driver: bridge
