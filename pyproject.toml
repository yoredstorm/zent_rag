[project]
name = "rag-as-a-service"
version = "0.1.0"
description = "RAG-as-a-Service Platform — AI Agent Orchestration with Full Observability"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "RAG Platform Team" }
]

[project.optional-dependencies]
prod = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "redis[hiredis]>=5.0.0",
    "litellm>=1.40.0",
    "qdrant-client>=1.9.0",
    "structlog>=24.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "alembic>=1.14.0",
    "sqlglot>=26.0.0",
]

dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.27.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes/pep8
    "B",                  # flake8-bugbear
    "S",                  # bandit (security)
    "I",                  # isort
    "T20",                # no prints
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B603"]  # assert (tests) y subprocess sin shell=True

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
