[project]
name = "rag-as-a-service"
version = "0.1.0"
description = "RAG-as-a-Service Platform — AI Agent Orchestration with Full Observability"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "RAG Platform Team" }
]
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
prod = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "redis[hiredis]>=5.0.0",
    "litellm>=1.40.0",
    "qdrant-client>=1.9.0",
    "structlog>=24.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "alembic>=1.14.0",
    "sqlglot>=26.0.0",
    "hvac>=2.0.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "markitdown[pdf,docx]>=0.1.3",
    "openpyxl>=3.1.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

# Connector Platform: drivers opcionales de SQL (instalar bajo demanda)
connectors = [
    "pymysql>=1.1.0",
    "pyodbc>=5.1.0",
    "oracledb>=2.0.0",
    "ibm-db-sa>=0.4.0",
]

dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.27.0",
    "pyright>=1.1.0",
]

[project.entry-points.zent_connectors]
postgres = "src.connectors.plugin.plugins.postgres:PostgresPlugin"
mysql = "src.connectors.plugin.plugins.sql_optional:MysqlPlugin"
mssql = "src.connectors.plugin.plugins.sql_optional:MssqlPlugin"
oracle = "src.connectors.plugin.plugins.sql_optional:OraclePlugin"
db2 = "src.connectors.plugin.plugins.sql_optional:Db2Plugin"
csv = "src.connectors.plugin.plugins.files:CsvPlugin"
excel = "src.connectors.plugin.plugins.files:ExcelPlugin"
json_file = "src.connectors.plugin.plugins.files:JsonFilePlugin"
pdf = "src.connectors.plugin.plugins.files:PdfPlugin"
rest_api = "src.connectors.plugin.plugins.api_plugins:RestApiPlugin"
graphql = "src.connectors.plugin.plugins.api_plugins:GraphqlPlugin"
s3_compat = "src.connectors.plugin.plugins.s3_compat:S3CompatPlugin"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes/pep8
    "B",                  # flake8-bugbear
    "S",                  # bandit (security)
    "I",                  # isort
    "T20",                # no prints
]
ignore = [
    "B008",   # Depends in defaults is FastAPI convention
    "B904",   # raise ... from err not always needed
    "B905",   # zip() strict not needed in controlled contexts
    "S101",   # assert is fine in tests
    "S104",   # 0.0.0.0 is explicit bind in docker
    "S106",   # "token_type" false positive
    "S110",   # try/except/pass is intentional in some cases
    "F841",   # unreferenced variable false positives
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "E402", "E501", "S105"]
"src/api/main.py" = ["E402"]  # sys.path.insert before imports
"src/api/routes/prompt.py" = ["E501"]  # long description strings
"src/agents/runtime/orchestrator.py" = ["E501"]  # prompt string constants
"src/infrastructure/observability/metrics.py" = ["F401"]  # Info imported for registry side-effect
"src/rag/evaluation/store.py" = ["S608"]
"src/rag/evaluation/judge.py" = ["E501"]  # prompt strings del juez
"src/agents/tools/sql_expert_postgres.py" = ["E501", "S608", "B007"]  # prompt strings, validated SQL, FK chains loop
"src/api/routes/admin.py" = ["S608", "F841"]  # validated identifiers, dev-only
"src/infrastructure/postgres/relational_db.py" = ["E402", "S608"]
"src/connectors/sql/ingestion.py" = ["S608"]
"src/connectors/sql/schema_discovery.py" = ["S608"]
"src/connectors/plugin/plugins/sql_optional.py" = ["S608"]  # LIMIT numérico casteado a int
"src/platform/billing/plan_limits.py" = ["S608"]  # columna de constante interna
"src/infrastructure/postgres/knowledge_repos.py" = ["S608"]  # identifiers de constantes internas
"src/infrastructure/db_init/versions/*.py" = ["S608", "E501"]  # identifiers de constantes internas
"src/verticals/**/*.py" = ["E501"]  # prompt string constants de verticals
"sdk/python/tests/**/*.py" = ["S101", "S105"]
"src/scripts/**/*.py" = ["T201"]  # CLI scripts use print for stdout

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B603"]  # assert (tests) y subprocess sin shell=True

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
