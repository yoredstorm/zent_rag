# =============================================================================
# Prometheus Configuration — RAG-as-a-Service Platform
# =============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Alertmanager (pendiente de configuración)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Reglas de alerta
rule_files:
  - "alert-rules.yml"

scrape_configs:
  # ---------------------------------------------------------------------------
  # FastAPI — Métricas de aplicación (endpoint /metrics expuesto por la app)
  # ---------------------------------------------------------------------------
  - job_name: "rag-api"
    metrics_path: "/metrics"
    scheme: http
    authorization:
      type: Bearer
      credentials: "rag-metrics-scrape-token"  # RAG_METRICS_TOKEN (override en prod)
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "rag-api"
          environment: "production"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "rag-api"

  # ---------------------------------------------------------------------------
  # PostgreSQL — Métricas de base de datos
  # ---------------------------------------------------------------------------
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]  # Futuro: pg-exporter sidecar

  # ---------------------------------------------------------------------------
  # Redis — Métricas de caché
  # ---------------------------------------------------------------------------
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]  # Futuro: redis-exporter sidecar

  # ---------------------------------------------------------------------------
  # Prometheus — Auto-monitorización
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
