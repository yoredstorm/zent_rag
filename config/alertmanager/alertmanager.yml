# =============================================================================
# Alertmanager — ZENT
# =============================================================================
# Conecta las reglas de config/prometheus/alert-rules.yml a un receptor.
# Estado de esta fase: receptor `default` SIN integración externa (las alertas
# quedan visibles en la UI/API de Alertmanager, no se envía a nadie todavía).
#
# Para conectar un canal real, reemplazar `default` por un webhook/Slack/etc.:
#
#   receivers:
#     - name: default
#       webhook_configs:
#         - url: https://hooks.example.com/zent-alerts
#           send_resolved: true
#
# Variables: ALERTMANAGER_WEBHOOK_URL (opcional; si está, se usa en runtime).
# =============================================================================
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity", "owner", "runbook"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Los invariantes duros (seguridad/aislamiento/autoridad) no se agrupan con
    # el resto: se quieren ruidosos y visibles.
    - matchers:
        - severity = critical
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # Si el API está caído, silenciar las alertas derivadas de sus métricas.
  - source_matchers: [alertname = "ZENTApiDown"]
    target_matchers: [severity =~ "warning|high"]
    equal: []

receivers:
  - name: default
    # Sin integración externa en esta fase (visible en /api/v2/alerts).
    webhook_configs: []
