server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: resolver dinámico para sobrevivir recreaciones de contenedores
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # Security headers (HSTS solo aplica en HTTPS; omitido en HTTP dev)
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: sin scripts inline/remotos — bloquea XSS de salida del LLM.
    # font-src: fuentes self-hosted (assets) + variantes de origen local + data:
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data: http://localhost:8080 http://127.0.0.1:8080; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        set $api_upstream http://api:8000;
        # Con variables, proxy_pass no añade el URI: pasar el path completo.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Idempotency-Key / PATCH viajan con proxy_pass_request_headers (on).
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }

    location /health {
        set $health_upstream http://api:8000;
        proxy_pass $health_upstream/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
    }

    # MCP Server — respuestas SSE: sin buffering y read timeout largo.
    location /mcp {
        set $mcp_upstream http://api:8000;
        proxy_pass $mcp_upstream$request_uri;
        proxy_http_version 1.1;
        # $http_host preserva el puerto (localhost:8080); $host lo elimina y
        # rompería el guard DNS-rebinding del transporte MCP.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }

    # Swagger/ReDoc cargan JS/CSS desde jsDelivr; un add_header aquí
    # sustituye los del server, así que se reponen los de seguridad.
    location /docs {
        set $docs_upstream http://api:8000;
        proxy_pass $docs_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:;" always;
    }

    location /redoc {
        set $redoc_upstream http://api:8000;
        proxy_pass $redoc_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; font-src 'self' data: https://cdn.jsdelivr.net;" always;
    }

    location /openapi.json {
        set $oa_upstream http://api:8000;
        proxy_pass $oa_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
