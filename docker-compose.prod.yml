  RAG_RAG_LONG_CONTEXT_REDUNDANT_STREAK: ${RAG_RAG_LONG_CONTEXT_REDUNDANT_STREAK:-2}
  RAG_RAG_LONG_CONTEXT_PRESERVE_UNITS: ${RAG_RAG_LONG_CONTEXT_PRESERVE_UNITS:-on}
  RAG_RAG_LONG_CONTEXT_UNIT_HEADROOM: ${RAG_RAG_LONG_CONTEXT_UNIT_HEADROOM:-0.5}
  # Response Intelligence: como se explica la respuesta (forma, no contenido).
  RAG_RAG_RESPONSE_INTELLIGENCE_MODE: ${RAG_RAG_RESPONSE_INTELLIGENCE_MODE:-rules}
