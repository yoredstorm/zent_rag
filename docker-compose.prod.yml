  RAG_DECISION_JUDGMENT_CACHE_TTL_SECONDS: ${RAG_DECISION_JUDGMENT_CACHE_TTL_SECONDS:-120}
  # JEV Preflight (docs/architecture/jev-preflight.md). Default off: sin juicio previo.
  RAG_JEV_PREFLIGHT_MODE: ${RAG_JEV_PREFLIGHT_MODE:-off}
  RAG_RAG_JEV_PREFLIGHT_CANARY_PERCENTAGE: ${RAG_RAG_JEV_PREFLIGHT_CANARY_PERCENTAGE:-0}
