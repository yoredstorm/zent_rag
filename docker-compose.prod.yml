# Production profile — no Ollama, no demo passwords in the file.
# Point RAG_POSTGRES_HOST / RAG_REDIS_URL / RAG_QDRANT_HOST at managed services
# or override the service hostnames. Demo stack remains docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (names only — set in the host or a secret manager):
#   RAG_ENVIRONMENT=production
#   RAG_POSTGRES_PASSWORD
#   RAG_PORTAL_SESSION_KEY          # openssl rand -hex 32
#   RAG_LITELLM_API_KEY
#   RAG_LITELLM_API_BASE
#   RAG_CORS_ALLOWED_ORIGINS        # explicit https origins, never *
#   RAG_EMBEDDING_MODEL             # hosted, e.g. openai/baai/bge-m3
#   RAG_EMBEDDING_FALLBACK_API_KEY  # optional: DeepInfra fallback (same dims)
#   METRICS_TOKEN
#   REDIS_PASSWORD
#   QDRANT_API_KEY
#
# .env se carga como env_file cuando existe (required: false); las variables
# del host o del orquestador siempre ganan sobre el archivo.

x-prod-env: &prod-env
  TZ: ${TZ:-UTC}
  RAG_ENVIRONMENT: production
  RAG_POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
  RAG_POSTGRES_PORT: ${RAG_POSTGRES_PORT:-5432}
  RAG_POSTGRES_USER: ${RAG_POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}
  RAG_POSTGRES_DB: ${RAG_POSTGRES_DB:-rag_platform}
  RAG_QDRANT_HOST: ${RAG_QDRANT_HOST:-qdrant}
  RAG_QDRANT_PORT: ${RAG_QDRANT_PORT:-6333}
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
  RAG_REDIS_URL: ${RAG_REDIS_URL:?set RAG_REDIS_URL}
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:?set RAG_LITELLM_API_BASE}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:?set RAG_LITELLM_API_KEY}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  # Modelos de razonamiento: apaga el thinking oculto que consume max_tokens.
  RAG_LLM_DISABLE_THINKING: ${RAG_LLM_DISABLE_THINKING:-false}
  # Fallback del AI Gateway con proveedor propio (p. ej. DeepInfra).
  RAG_GATEWAY_FALLBACK_MODEL: ${RAG_GATEWAY_FALLBACK_MODEL:-}
  RAG_GATEWAY_FALLBACK_API_BASE: ${RAG_GATEWAY_FALLBACK_API_BASE:-}
  RAG_GATEWAY_FALLBACK_API_KEY: ${RAG_GATEWAY_FALLBACK_API_KEY:-}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_EMBEDDING_FALLBACK_MODEL: ${RAG_EMBEDDING_FALLBACK_MODEL:-openai/BAAI/bge-m3}
  RAG_EMBEDDING_FALLBACK_API_BASE: ${RAG_EMBEDDING_FALLBACK_API_BASE:-https://api.deepinfra.com/v1/openai}
  RAG_EMBEDDING_FALLBACK_API_KEY: ${RAG_EMBEDDING_FALLBACK_API_KEY:-}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:?set explicit CORS origins}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:?set RAG_PORTAL_SESSION_KEY}
  RAG_RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_MANAGED_DB_PROVIDER: ${RAG_MANAGED_DB_PROVIDER:-local}
  RAG_METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
  RAG_UPLOAD_DIR: /app/uploads
  # Subida de archivos: 25 MB por archivo; el body HTTP lleva aire (32 MB).
  RAG_MAX_BODY_BYTES: ${RAG_MAX_BODY_BYTES:-33554432}
  # Cognitive Runtime (C1-C9): off | shadow | limited | active (default off).
  RAG_COGNITIVE_OS_ENABLED: ${RAG_COGNITIVE_OS_ENABLED:-off}
  # C8: umbral determinístico de referencias para HIGH_IMPACT_CHANGE.
  RAG_KNOWLEDGE_HIGH_IMPACT_MIN_REFS: ${RAG_KNOWLEDGE_HIGH_IMPACT_MIN_REFS:-5}
  RAG_DECISION_ROUTING_MODE: ${RAG_DECISION_ROUTING_MODE:-legacy}
  RAG_JEV_SHADOW_MODE: ${RAG_JEV_SHADOW_MODE:-false}
  RAG_JEV_CANARY_PERCENTAGE: ${RAG_JEV_CANARY_PERCENTAGE:-0}
  RAG_JEV_CANARY_MODEL: ${RAG_JEV_CANARY_MODEL:-}
  RAG_ADAPTIVE_RAG_MODE: ${RAG_ADAPTIVE_RAG_MODE:-off}
  RAG_ADAPTIVE_RAG_CANARY_PERCENTAGE: ${RAG_ADAPTIVE_RAG_CANARY_PERCENTAGE:-0}
  # Decision Engine tuning. Empty key = rules + LLM fallback only.
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  RAG_JEV_API_KEY: ${RAG_JEV_API_KEY:-}
  RAG_JEV_MODEL: ${RAG_JEV_MODEL:-jev-latest}
  RAG_JEV_BASE_URL: ${RAG_JEV_BASE_URL:-https://api.typesafe.ai}
  RAG_JEV_TIMEOUT_SECONDS: ${RAG_JEV_TIMEOUT_SECONDS:-8}
  RAG_JEV_ROUTING_HIGH_CONFIDENCE: ${RAG_JEV_ROUTING_HIGH_CONFIDENCE:-0.90}
  RAG_JEV_ROUTING_LOW_CONFIDENCE: ${RAG_JEV_ROUTING_LOW_CONFIDENCE:-0.65}
  RAG_JEV_CIRCUIT_FAILURE_THRESHOLD: ${RAG_JEV_CIRCUIT_FAILURE_THRESHOLD:-3}
  RAG_JEV_CIRCUIT_RECOVERY_SECONDS: ${RAG_JEV_CIRCUIT_RECOVERY_SECONDS:-30}
  RAG_DECISION_FALLBACK_MODEL: ${RAG_DECISION_FALLBACK_MODEL:-}
  RAG_DECISION_COMPLEX_MODEL: ${RAG_DECISION_COMPLEX_MODEL:-}
  RAG_DECISION_NOUL_YES: ${RAG_DECISION_NOUL_YES:-0.65}
  RAG_DECISION_NOUL_NO: ${RAG_DECISION_NOUL_NO:-0.35}
  RAG_ADAPTIVE_RAG_MAX_RETRIEVAL_ATTEMPTS: ${RAG_ADAPTIVE_RAG_MAX_RETRIEVAL_ATTEMPTS:-3}
  RAG_ADAPTIVE_RAG_TOP_K_MIN: ${RAG_ADAPTIVE_RAG_TOP_K_MIN:-3}
  RAG_ADAPTIVE_RAG_TOP_K_MAX: ${RAG_ADAPTIVE_RAG_TOP_K_MAX:-12}
  RAG_ADAPTIVE_RAG_TOP_K_LOOKUP: ${RAG_ADAPTIVE_RAG_TOP_K_LOOKUP:-3}
  RAG_ADAPTIVE_RAG_TOP_K_COMPARE: ${RAG_ADAPTIVE_RAG_TOP_K_COMPARE:-8}
  RAG_ADAPTIVE_RAG_TOP_K_MULTI: ${RAG_ADAPTIVE_RAG_TOP_K_MULTI:-12}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE:-0.25}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE:-0.25}
  RAG_ADAPTIVE_RAG_CACHE_TTL_SECONDS: ${RAG_ADAPTIVE_RAG_CACHE_TTL_SECONDS:-600}
