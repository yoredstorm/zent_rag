# Production profile — no Ollama, no demo passwords in the file.
# Point RAG_POSTGRES_HOST / RAG_REDIS_URL / RAG_QDRANT_HOST at managed services
# or override the service hostnames. Demo stack remains docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (names only — set in the host or a secret manager):
#   RAG_ENVIRONMENT=production
#   RAG_POSTGRES_PASSWORD
#   RAG_PORTAL_SESSION_KEY          # openssl rand -hex 32
#   RAG_LITELLM_API_KEY
#   RAG_LITELLM_API_BASE
#   RAG_CORS_ALLOWED_ORIGINS        # explicit https origins, never *
#   RAG_EMBEDDING_MODEL             # hosted, e.g. openai/baai/bge-m3
#   RAG_METRICS_TOKEN
#   REDIS_PASSWORD
#   QDRANT_API_KEY

version: "3.9"

x-prod-env: &prod-env
  TZ: ${TZ:-UTC}
  RAG_ENVIRONMENT: production
  RAG_POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
  RAG_POSTGRES_PORT: ${RAG_POSTGRES_PORT:-5432}
  RAG_POSTGRES_USER: ${RAG_POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}
  RAG_POSTGRES_DB: ${RAG_POSTGRES_DB:-rag_platform}
  RAG_QDRANT_HOST: ${RAG_QDRANT_HOST:-qdrant}
  RAG_QDRANT_PORT: ${RAG_QDRANT_PORT:-6333}
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
  RAG_REDIS_URL: ${RAG_REDIS_URL:?set RAG_REDIS_URL}
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:?set RAG_LITELLM_API_BASE}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:?set RAG_LITELLM_API_KEY}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:?set explicit CORS origins}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:?set RAG_PORTAL_SESSION_KEY}
  RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_METRICS_TOKEN: ${RAG_METRICS_TOKEN:?set RAG_METRICS_TOKEN}
  RAG_UPLOAD_DIR: /app/uploads

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "worker_entry.py"]
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      disable: true
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"

volumes:
  uploads_data:
    # Prefer S3-compatible storage for file sources; this volume is a last resort.
    # See docs/platform/PRODUCTION.md
