# Production profile — no Ollama, no demo passwords in the file.
# Point RAG_POSTGRES_HOST / RAG_REDIS_URL / RAG_QDRANT_HOST at managed services
# or override the service hostnames. Demo stack remains docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (names only — set in the host or a secret manager):
#   RAG_ENVIRONMENT=production
#   RAG_POSTGRES_PASSWORD
#   RAG_PORTAL_SESSION_KEY          # openssl rand -hex 32
#   RAG_LITELLM_API_KEY
#   RAG_LITELLM_API_BASE
#   RAG_CORS_ALLOWED_ORIGINS        # explicit https origins, never *
#   RAG_EMBEDDING_MODEL             # hosted, e.g. openai/baai/bge-m3
#   RAG_METRICS_TOKEN
#   REDIS_PASSWORD
#   QDRANT_API_KEY

version: "3.9"

x-prod-env: &prod-env
  TZ: ${TZ:-UTC}
  RAG_ENVIRONMENT: production
  RAG_POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
  RAG_POSTGRES_PORT: ${RAG_POSTGRES_PORT:-5432}
  RAG_POSTGRES_USER: ${RAG_POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}
  RAG_POSTGRES_DB: ${RAG_POSTGRES_DB:-rag_platform}
  RAG_QDRANT_HOST: ${RAG_QDRANT_HOST:-qdrant}
  RAG_QDRANT_PORT: ${RAG_QDRANT_PORT:-6333}
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
  RAG_REDIS_URL: ${RAG_REDIS_URL:?set RAG_REDIS_URL}
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:?set RAG_LITELLM_API_BASE}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:?set RAG_LITELLM_API_KEY}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:?set explicit CORS origins}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:?set RAG_PORTAL_SESSION_KEY}
  RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_MANAGED_DB_PROVIDER: ${RAG_MANAGED_DB_PROVIDER:-local}
  RAG_METRICS_TOKEN: ${RAG_METRICS_TOKEN:?set RAG_METRICS_TOKEN}
  RAG_UPLOAD_DIR: /app/uploads
  # Subida de archivos: 25 MB por archivo; el body HTTP lleva aire (32 MB).
  RAG_MAX_BODY_BYTES: ${RAG_MAX_BODY_BYTES:-33554432}
  # Cognitive OS (fases 1-10): off | shadow | limited | active (default off).
  RAG_COGNITIVE_OS_ENABLED: ${RAG_COGNITIVE_OS_ENABLED:-off}
  RAG_DECISION_ROUTING_MODE: ${RAG_DECISION_ROUTING_MODE:-legacy}
  RAG_JEV_SHADOW_MODE: ${RAG_JEV_SHADOW_MODE:-false}
  RAG_JEV_CANARY_PERCENTAGE: ${RAG_JEV_CANARY_PERCENTAGE:-0}
  RAG_JEV_CANARY_MODEL: ${RAG_JEV_CANARY_MODEL:-}
  RAG_ADAPTIVE_RAG_MODE: ${RAG_ADAPTIVE_RAG_MODE:-off}
  RAG_ADAPTIVE_RAG_CANARY_PERCENTAGE: ${RAG_ADAPTIVE_RAG_CANARY_PERCENTAGE:-0}
  # Decision Engine tuning. Empty key = rules + LLM fallback only.
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  RAG_JEV_API_KEY: ${RAG_JEV_API_KEY:-}
  RAG_JEV_MODEL: ${RAG_JEV_MODEL:-jev-latest}
  RAG_JEV_BASE_URL: ${RAG_JEV_BASE_URL:-https://api.typesafe.ai}
  RAG_JEV_TIMEOUT_SECONDS: ${RAG_JEV_TIMEOUT_SECONDS:-8}
  RAG_JEV_ROUTING_HIGH_CONFIDENCE: ${RAG_JEV_ROUTING_HIGH_CONFIDENCE:-0.90}
  RAG_JEV_ROUTING_LOW_CONFIDENCE: ${RAG_JEV_ROUTING_LOW_CONFIDENCE:-0.65}
  RAG_JEV_CIRCUIT_FAILURE_THRESHOLD: ${RAG_JEV_CIRCUIT_FAILURE_THRESHOLD:-3}
  RAG_JEV_CIRCUIT_RECOVERY_SECONDS: ${RAG_JEV_CIRCUIT_RECOVERY_SECONDS:-30}
  RAG_DECISION_FALLBACK_MODEL: ${RAG_DECISION_FALLBACK_MODEL:-}
  RAG_DECISION_COMPLEX_MODEL: ${RAG_DECISION_COMPLEX_MODEL:-}
  RAG_DECISION_NOUL_YES: ${RAG_DECISION_NOUL_YES:-0.65}
  RAG_DECISION_NOUL_NO: ${RAG_DECISION_NOUL_NO:-0.35}
  RAG_ADAPTIVE_RAG_MAX_RETRIEVAL_ATTEMPTS: ${RAG_ADAPTIVE_RAG_MAX_RETRIEVAL_ATTEMPTS:-3}
  RAG_ADAPTIVE_RAG_TOP_K_MIN: ${RAG_ADAPTIVE_RAG_TOP_K_MIN:-3}
  RAG_ADAPTIVE_RAG_TOP_K_MAX: ${RAG_ADAPTIVE_RAG_TOP_K_MAX:-12}
  RAG_ADAPTIVE_RAG_TOP_K_LOOKUP: ${RAG_ADAPTIVE_RAG_TOP_K_LOOKUP:-3}
  RAG_ADAPTIVE_RAG_TOP_K_COMPARE: ${RAG_ADAPTIVE_RAG_TOP_K_COMPARE:-8}
  RAG_ADAPTIVE_RAG_TOP_K_MULTI: ${RAG_ADAPTIVE_RAG_TOP_K_MULTI:-12}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_SCORE:-0.25}
  RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE: ${RAG_ADAPTIVE_RAG_EVIDENCE_MIN_COVERAGE:-0.25}
  RAG_ADAPTIVE_RAG_CACHE_TTL_SECONDS: ${RAG_ADAPTIVE_RAG_CACHE_TTL_SECONDS:-600}
  RAG_ADAPTIVE_RAG_JEV_EVIDENCE: ${RAG_ADAPTIVE_RAG_JEV_EVIDENCE:-true}
  RAG_ADAPTIVE_RAG_FAST_PATH: ${RAG_ADAPTIVE_RAG_FAST_PATH:-true}
  RAG_ADAPTIVE_RAG_REWRITE: ${RAG_ADAPTIVE_RAG_REWRITE:-true}
  RAG_RUNTIME_TOOL_ROUTING_MODE: ${RAG_RUNTIME_TOOL_ROUTING_MODE:-off}
  RAG_RUNTIME_TERMINATION_GATE: ${RAG_RUNTIME_TERMINATION_GATE:-off}
  RAG_RUNTIME_ANSWER_GATE: ${RAG_RUNTIME_ANSWER_GATE:-off}
  RAG_RUNTIME_JEV_STATE_MAX_CHARS: ${RAG_RUNTIME_JEV_STATE_MAX_CHARS:-30000}
  RAG_RUNTIME_JEV_TOOL_CONFIDENCE: ${RAG_RUNTIME_JEV_TOOL_CONFIDENCE:-0.60}
  RAG_RUNTIME_JEV_MIN_TOOLS: ${RAG_RUNTIME_JEV_MIN_TOOLS:-3}
  RAG_RUNTIME_JEV_ANSWER_APPROVE: ${RAG_RUNTIME_JEV_ANSWER_APPROVE:-0.66}
  RAG_RUNTIME_JEV_ANSWER_REVISE: ${RAG_RUNTIME_JEV_ANSWER_REVISE:-0.40}
  RAG_RUNTIME_SHADOW_SAMPLE_RATE: ${RAG_RUNTIME_SHADOW_SAMPLE_RATE:-0}
  RAG_RUNTIME_SOURCE_AWARE_TOOLS: ${RAG_RUNTIME_SOURCE_AWARE_TOOLS:-true}
  RAG_RUNTIME_FAILED_TOOL_GUARD: ${RAG_RUNTIME_FAILED_TOOL_GUARD:-true}
  RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT:-0.40}
  RAG_RUNTIME_EFFICIENCY_COST_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_COST_WEIGHT:-0.25}
  RAG_RUNTIME_EFFICIENCY_LATENCY_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_LATENCY_WEIGHT:-0.20}
  RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT:-0.15}
  # Evidence Reasoning (Fase 6). Default off; shadow mide sin responder.
  RAG_EVIDENCE_REASONING_MODE: ${RAG_EVIDENCE_REASONING_MODE:-off}
  RAG_EVIDENCE_REASONING_CANARY_PERCENT: ${RAG_EVIDENCE_REASONING_CANARY_PERCENT:-0}
  RAG_EVIDENCE_REASONING_MAX_EVENTS: ${RAG_EVIDENCE_REASONING_MAX_EVENTS:-200}
  RAG_EVIDENCE_REASONING_MAX_HYPOTHESES: ${RAG_EVIDENCE_REASONING_MAX_HYPOTHESES:-4}
  RAG_EVIDENCE_REASONING_MAX_REQUIREMENTS: ${RAG_EVIDENCE_REASONING_MAX_REQUIREMENTS:-6}
  RAG_EVIDENCE_REASONING_MAX_RETRIEVAL_ROUNDS: ${RAG_EVIDENCE_REASONING_MAX_RETRIEVAL_ROUNDS:-4}
  RAG_EVIDENCE_REASONING_MAX_ANALYSIS_STEPS: ${RAG_EVIDENCE_REASONING_MAX_ANALYSIS_STEPS:-10}
  # Decision Engine batching (ADR decision-engine-batching.md). Default off.
  RAG_DECISION_BATCH_MODE: ${RAG_DECISION_BATCH_MODE:-off}
  RAG_DECISION_PASSAGE_JUDGE: ${RAG_DECISION_PASSAGE_JUDGE:-true}
  RAG_DECISION_PASSAGE_MAX: ${RAG_DECISION_PASSAGE_MAX:-5}
  RAG_DECISION_CLAIMS: ${RAG_DECISION_CLAIMS:-true}
  RAG_DECISION_CLAIMS_MAX: ${RAG_DECISION_CLAIMS_MAX:-6}
  RAG_DECISION_CLAIMS_LEDGER: ${RAG_DECISION_CLAIMS_LEDGER:-true}
  RAG_DECISION_JUDGMENT_CACHE_TTL_SECONDS: ${RAG_DECISION_JUDGMENT_CACHE_TTL_SECONDS:-120}
  # Judgment Fabric (ADR judgment-fabric.md). Default off: target explícito.
  RAG_DECISION_TARGET_SELECTION: ${RAG_DECISION_TARGET_SELECTION:-off}
  RAG_DECISION_RISK_MAX_SELECTABLE: ${RAG_DECISION_RISK_MAX_SELECTABLE:-high}
  RAG_DECISION_RISK_LOW_CHOICE: ${RAG_DECISION_RISK_LOW_CHOICE:-0.60}
  RAG_DECISION_RISK_MEDIUM_CHOICE: ${RAG_DECISION_RISK_MEDIUM_CHOICE:-0.70}
  RAG_DECISION_RISK_HIGH_CHOICE: ${RAG_DECISION_RISK_HIGH_CHOICE:-0.80}
  RAG_DECISION_RISK_CRITICAL_CHOICE: ${RAG_DECISION_RISK_CRITICAL_CHOICE:-0.90}
  RAG_DECISION_RISK_HIGH_WARRANT_REQUIRED: ${RAG_DECISION_RISK_HIGH_WARRANT_REQUIRED:-true}
  RAG_DECISION_RISK_CRITICAL_WARRANT_REQUIRED: ${RAG_DECISION_RISK_CRITICAL_WARRANT_REQUIRED:-true}
  RAG_DECISION_RISK_HIGH_WARRANT: ${RAG_DECISION_RISK_HIGH_WARRANT:-0.65}
  RAG_DECISION_RISK_CRITICAL_WARRANT: ${RAG_DECISION_RISK_CRITICAL_WARRANT:-0.75}
  RAG_DECISION_RISK_LOW_FALLBACK: ${RAG_DECISION_RISK_LOW_FALLBACK:-respond_directly}
  RAG_DECISION_RISK_MEDIUM_FALLBACK: ${RAG_DECISION_RISK_MEDIUM_FALLBACK:-ask_clarification}
  RAG_DECISION_RISK_HIGH_FALLBACK: ${RAG_DECISION_RISK_HIGH_FALLBACK:-human_review}
  RAG_DECISION_RISK_CRITICAL_FALLBACK: ${RAG_DECISION_RISK_CRITICAL_FALLBACK:-human_review}
  # -------------------------------------------------------------------------
  # Knowledge V2 + Knowledge Tabular V2 (Excel/CSV).
  # V2 queda OFF por ADR hasta calibrar shadow; tabular es inerte sin V2.
  # -------------------------------------------------------------------------
  RAG_KNOWLEDGE_V2_ENABLED: ${RAG_KNOWLEDGE_V2_ENABLED:-false}
  RAG_KNOWLEDGE_V2_SHADOW: ${RAG_KNOWLEDGE_V2_SHADOW:-false}
  RAG_KNOWLEDGE_V2_PROMOTE: ${RAG_KNOWLEDGE_V2_PROMOTE:-false}
  RAG_KNOWLEDGE_SUMMARY_MODE: ${RAG_KNOWLEDGE_SUMMARY_MODE:-off}
  RAG_KNOWLEDGE_TABULAR_ENABLED: ${RAG_KNOWLEDGE_TABULAR_ENABLED:-true}
  RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES: ${RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES:-52428800}
  RAG_KNOWLEDGE_TABULAR_MAX_SHEETS: ${RAG_KNOWLEDGE_TABULAR_MAX_SHEETS:-50}
  RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET: ${RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET:-100000}
  RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS: ${RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS:-512}
  RAG_KNOWLEDGE_TABULAR_MAX_CELLS: ${RAG_KNOWLEDGE_TABULAR_MAX_CELLS:-2000000}
  RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS: ${RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS:-5000}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE:-20}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP:-2}
  RAG_KNOWLEDGE_TABULAR_CELL_CHUNKS_ENABLED: ${RAG_KNOWLEDGE_TABULAR_CELL_CHUNKS_ENABLED:-false}
  RAG_KNOWLEDGE_TABULAR_MAX_CELL_CHUNKS: ${RAG_KNOWLEDGE_TABULAR_MAX_CELL_CHUNKS:-200}
  RAG_KNOWLEDGE_TABULAR_MANAGED_DB_ENABLED: ${RAG_KNOWLEDGE_TABULAR_MANAGED_DB_ENABLED:-false}
  RAG_KNOWLEDGE_TABULAR_SQL_FIRST: ${RAG_KNOWLEDGE_TABULAR_SQL_FIRST:-true}
  RAG_KNOWLEDGE_TABULAR_LAZY_ENABLED: ${RAG_KNOWLEDGE_TABULAR_LAZY_ENABLED:-true}
  RAG_KNOWLEDGE_TABULAR_LOOKUP_MAX_ROWS: ${RAG_KNOWLEDGE_TABULAR_LOOKUP_MAX_ROWS:-1000}
  RAG_KNOWLEDGE_TABULAR_SQL_MIN_CONFIDENCE: ${RAG_KNOWLEDGE_TABULAR_SQL_MIN_CONFIDENCE:-0.7}
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_ROWS: ${RAG_KNOWLEDGE_TABULAR_LAZY_MAX_ROWS:-5000}
  RAG_KNOWLEDGE_TABULAR_LAZY_TIMEOUT_SECONDS: ${RAG_KNOWLEDGE_TABULAR_LAZY_TIMEOUT_SECONDS:-15}
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_SOURCES: ${RAG_KNOWLEDGE_TABULAR_LAZY_MAX_SOURCES:-3}
  RAG_SEARCH_KNOWLEDGE_TIMEOUT_SECONDS: ${RAG_SEARCH_KNOWLEDGE_TIMEOUT_SECONDS:-20}
  # Universal API Connector: el API necesita egress HTTPS hacia las APIs que
  # importen los tenants (demos: pokeapi.co, open-meteo.com,
  # jsonplaceholder.typicode.com). SSRF check, allowlist y rate limits en runtime.
  RAG_CONNECTOR_SSRF_BLOCK_PRIVATE: ${RAG_CONNECTOR_SSRF_BLOCK_PRIVATE:-true}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "worker_entry.py"]
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      disable: true
    # El API aplica `alembic upgrade head` (incluida la 118 tabular_*): el
    # worker espera a que esté healthy para no consumir jobs Excel/CSV antes
    # de que existan las tablas tabulares.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"

volumes:
  uploads_data:
    # Prefer S3-compatible storage for file sources; this volume is a last resort.
    # See docs/platform/PRODUCTION.md
