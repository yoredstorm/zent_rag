  RAG_RAG_RESPONSE_PRESENTATION_GATE: ${RAG_RAG_RESPONSE_PRESENTATION_GATE:-true}
  # Agent JEV Loop: una llamada JEV por paso; el veredicto manda (con re-busqueda).
  RAG_RUNTIME_AGENT_JEV_LOOP: ${RAG_RUNTIME_AGENT_JEV_LOOP:-on}
  RAG_RUNTIME_AGENT_JEV_LOOP_CANARY_PERCENTAGE: ${RAG_RUNTIME_AGENT_JEV_LOOP_CANARY_PERCENTAGE:-0}
  RAG_RUNTIME_AGENT_MAX_RETRIEVAL_ROUNDS: ${RAG_RUNTIME_AGENT_MAX_RETRIEVAL_ROUNDS:-2}
