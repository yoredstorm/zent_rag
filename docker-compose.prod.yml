  RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_FALLBACK_WEIGHT:-0.15}
  # Tope de tokens POR LLAMADA de respuesta (no el del run completo).
  RAG_RUNTIME_ANSWER_MAX_TOKENS: ${RAG_RUNTIME_ANSWER_MAX_TOKENS:-4096}
  # Evidence Reasoning (Fase 6). Default off; shadow mide sin responder.
  RAG_RAG_EVIDENCE_REASONING_MODE: ${RAG_RAG_EVIDENCE_REASONING_MODE:-off}
  RAG_RAG_EVIDENCE_REASONING_CANARY_PERCENT: ${RAG_RAG_EVIDENCE_REASONING_CANARY_PERCENT:-0}
  RAG_RAG_EVIDENCE_REASONING_MAX_EVENTS: ${RAG_RAG_EVIDENCE_REASONING_MAX_EVENTS:-200}
  RAG_RAG_EVIDENCE_REASONING_MAX_HYPOTHESES: ${RAG_RAG_EVIDENCE_REASONING_MAX_HYPOTHESES:-4}
  RAG_RAG_EVIDENCE_REASONING_MAX_REQUIREMENTS: ${RAG_RAG_EVIDENCE_REASONING_MAX_REQUIREMENTS:-6}
