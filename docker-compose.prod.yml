  RAG_RUNTIME_TERMINATION_GATE: ${RAG_RUNTIME_TERMINATION_GATE:-off}
  RAG_RUNTIME_ANSWER_GATE: ${RAG_RUNTIME_ANSWER_GATE:-off}
