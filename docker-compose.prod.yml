# Production profile — no Ollama, no demo passwords in the file.
# Point RAG_POSTGRES_HOST / RAG_REDIS_URL / RAG_QDRANT_HOST at managed services
# or override the service hostnames. Demo stack remains docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (names only — set in the host or a secret manager):
#   RAG_ENVIRONMENT=production
#   RAG_POSTGRES_PASSWORD
#   RAG_PORTAL_SESSION_KEY          # openssl rand -hex 32
#   RAG_LITELLM_API_KEY
#   RAG_LITELLM_API_BASE
#   RAG_CORS_ALLOWED_ORIGINS        # explicit https origins, never *
#   RAG_EMBEDDING_MODEL             # hosted, e.g. openai/baai/bge-m3
#   RAG_METRICS_TOKEN
#   REDIS_PASSWORD
#   QDRANT_API_KEY

version: "3.9"

x-prod-env: &prod-env
  TZ: ${TZ:-UTC}
  RAG_ENVIRONMENT: production
  RAG_POSTGRES_HOST: ${RAG_POSTGRES_HOST:-postgres}
  RAG_POSTGRES_PORT: ${RAG_POSTGRES_PORT:-5432}
  RAG_POSTGRES_USER: ${RAG_POSTGRES_USER:-rag_user}
  RAG_POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?set RAG_POSTGRES_PASSWORD}
  RAG_POSTGRES_DB: ${RAG_POSTGRES_DB:-rag_platform}
  RAG_QDRANT_HOST: ${RAG_QDRANT_HOST:-qdrant}
  RAG_QDRANT_PORT: ${RAG_QDRANT_PORT:-6333}
  RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
  RAG_REDIS_URL: ${RAG_REDIS_URL:?set RAG_REDIS_URL}
  RAG_LITELLM_API_BASE: ${RAG_LITELLM_API_BASE:?set RAG_LITELLM_API_BASE}
  RAG_LITELLM_API_KEY: ${RAG_LITELLM_API_KEY:?set RAG_LITELLM_API_KEY}
  RAG_LITELLM_DEFAULT_MODEL: ${RAG_LITELLM_DEFAULT_MODEL:-gpt-4o-mini}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-openai/baai/bge-m3}
  RAG_CORS_ALLOWED_ORIGINS: ${RAG_CORS_ALLOWED_ORIGINS:?set explicit CORS origins}
  RAG_PORTAL_SESSION_KEY: ${RAG_PORTAL_SESSION_KEY:?set RAG_PORTAL_SESSION_KEY}
  RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_MANAGED_DB_PROVIDER: ${RAG_MANAGED_DB_PROVIDER:-local}
  RAG_METRICS_TOKEN: ${RAG_METRICS_TOKEN:?set RAG_METRICS_TOKEN}
  RAG_UPLOAD_DIR: /app/uploads
  # Cognitive OS (fases 1-10): off | shadow | limited | active (default off).
  RAG_COGNITIVE_OS_ENABLED: ${RAG_COGNITIVE_OS_ENABLED:-off}
  # -------------------------------------------------------------------------
  # Knowledge V2 + Knowledge Tabular V2 (Excel/CSV).
  # V2 queda OFF por ADR hasta calibrar shadow; tabular es inerte sin V2.
  # -------------------------------------------------------------------------
  RAG_KNOWLEDGE_V2_ENABLED: ${RAG_KNOWLEDGE_V2_ENABLED:-false}
  RAG_KNOWLEDGE_V2_SHADOW: ${RAG_KNOWLEDGE_V2_SHADOW:-false}
  RAG_KNOWLEDGE_V2_PROMOTE: ${RAG_KNOWLEDGE_V2_PROMOTE:-false}
  RAG_KNOWLEDGE_SUMMARY_MODE: ${RAG_KNOWLEDGE_SUMMARY_MODE:-off}
  RAG_KNOWLEDGE_TABULAR_ENABLED: ${RAG_KNOWLEDGE_TABULAR_ENABLED:-true}
  RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES: ${RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES:-52428800}
  RAG_KNOWLEDGE_TABULAR_MAX_SHEETS: ${RAG_KNOWLEDGE_TABULAR_MAX_SHEETS:-50}
  RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET: ${RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET:-100000}
  RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS: ${RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS:-512}
  RAG_KNOWLEDGE_TABULAR_MAX_CELLS: ${RAG_KNOWLEDGE_TABULAR_MAX_CELLS:-2000000}
  RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS: ${RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS:-5000}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE:-20}
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP: ${RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP:-2}
  RAG_KNOWLEDGE_TABULAR_CELL_CHUNKS_ENABLED: ${RAG_KNOWLEDGE_TABULAR_CELL_CHUNKS_ENABLED:-false}
  RAG_KNOWLEDGE_TABULAR_MAX_CELL_CHUNKS: ${RAG_KNOWLEDGE_TABULAR_MAX_CELL_CHUNKS:-200}
  RAG_KNOWLEDGE_TABULAR_MANAGED_DB_ENABLED: ${RAG_KNOWLEDGE_TABULAR_MANAGED_DB_ENABLED:-false}
  RAG_KNOWLEDGE_TABULAR_SQL_FIRST: ${RAG_KNOWLEDGE_TABULAR_SQL_FIRST:-true}
  RAG_KNOWLEDGE_TABULAR_LAZY_ENABLED: ${RAG_KNOWLEDGE_TABULAR_LAZY_ENABLED:-true}
  RAG_KNOWLEDGE_TABULAR_LOOKUP_MAX_ROWS: ${RAG_KNOWLEDGE_TABULAR_LOOKUP_MAX_ROWS:-1000}
  RAG_KNOWLEDGE_TABULAR_SQL_MIN_CONFIDENCE: ${RAG_KNOWLEDGE_TABULAR_SQL_MIN_CONFIDENCE:-0.7}
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_ROWS: ${RAG_KNOWLEDGE_TABULAR_LAZY_MAX_ROWS:-5000}
  RAG_KNOWLEDGE_TABULAR_LAZY_TIMEOUT_SECONDS: ${RAG_KNOWLEDGE_TABULAR_LAZY_TIMEOUT_SECONDS:-15}
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_SOURCES: ${RAG_KNOWLEDGE_TABULAR_LAZY_MAX_SOURCES:-3}
  RAG_SEARCH_KNOWLEDGE_TIMEOUT_SECONDS: ${RAG_SEARCH_KNOWLEDGE_TIMEOUT_SECONDS:-20}
  # Universal API Connector: el API necesita egress HTTPS hacia las APIs que
  # importen los tenants (demos: pokeapi.co, open-meteo.com,
  # jsonplaceholder.typicode.com). SSRF check, allowlist y rate limits en runtime.
  RAG_CONNECTOR_SSRF_BLOCK_PRIVATE: ${RAG_CONNECTOR_SSRF_BLOCK_PRIVATE:-true}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "worker_entry.py"]
    environment:
      <<: *prod-env
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      disable: true
    # El API aplica `alembic upgrade head` (incluida la 118 tabular_*): el
    # worker espera a que esté healthy para no consumir jobs Excel/CSV antes
    # de que existan las tablas tabulares.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"

volumes:
  uploads_data:
    # Prefer S3-compatible storage for file sources; this volume is a last resort.
    # See docs/platform/PRODUCTION.md
