  RAG_RAG_JEV_PREFLIGHT_ALLOW_DETERMINISTIC_ANSWER: ${RAG_RAG_JEV_PREFLIGHT_ALLOW_DETERMINISTIC_ANSWER:-false}
  RAG_RAG_JEV_PREFLIGHT_ALLOW_SMALL_TIER: ${RAG_RAG_JEV_PREFLIGHT_ALLOW_SMALL_TIER:-true}
  RAG_RAG_JEV_PREFLIGHT_EXTRA_RETRIEVAL: ${RAG_RAG_JEV_PREFLIGHT_EXTRA_RETRIEVAL:-true}
  RAG_RAG_JEV_PREFLIGHT_REASONING_FIRST: ${RAG_RAG_JEV_PREFLIGHT_REASONING_FIRST:-true}
  # Adaptive Long-Context Engine (docs/architecture/adaptive-long-context.md).
  # Default off: sin loop de expansion. Rollout: shadow, canary, active.
  RAG_RAG_EXACT_SEARCH: ${RAG_RAG_EXACT_SEARCH:-on}
  RAG_RAG_EXACT_SEARCH_CHUNKS: ${RAG_RAG_EXACT_SEARCH_CHUNKS:-4}
  RAG_RAG_EXACT_SEARCH_MAX_NEEDLES: ${RAG_RAG_EXACT_SEARCH_MAX_NEEDLES:-8}
  RAG_RAG_EXACT_SEARCH_MAX_POINTS: ${RAG_RAG_EXACT_SEARCH_MAX_POINTS:-4000}
  RAG_RAG_EXACT_SEARCH_MAX_MS: ${RAG_RAG_EXACT_SEARCH_MAX_MS:-1500}
  RAG_RAG_TECHNICAL_QUERY_VIEWS: ${RAG_RAG_TECHNICAL_QUERY_VIEWS:-on}
  RAG_RAG_SOURCE_ROUTING: ${RAG_RAG_SOURCE_ROUTING:-on}
  RAG_RAG_LONG_CONTEXT_MODE: ${RAG_RAG_LONG_CONTEXT_MODE:-off}
  RAG_RAG_LONG_CONTEXT_CANARY_PERCENTAGE: ${RAG_RAG_LONG_CONTEXT_CANARY_PERCENTAGE:-0}
