  # Universal API Connector: el API necesita egress HTTPS hacia las APIs que
  # importen los tenants (demos: pokeapi.co, open-meteo.com,
  # jsonplaceholder.typicode.com). SSRF check, allowlist y rate limits en runtime.
  RAG_CONNECTOR_SSRF_BLOCK_PRIVATE: ${RAG_CONNECTOR_SSRF_BLOCK_PRIVATE:-true}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Worker target: la API también necesita JVM + OpenDataLoader para la
      # ingesta in-process (OpenDataLoader es el parser PDF productivo).
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *prod-env
      # Identidad de servicio para runtime_identity / build_parity.
      RAG_SERVICE_NAME: api
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_API_PORT:-8000}:8000"

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Con JVM (OpenDataLoader PDF). La API default queda sin JVM.
      target: worker
    command: ["python", "worker_entry.py"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *prod-env
      RAG_SERVICE_NAME: ingestion-worker
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      disable: true
    # El API aplica `alembic upgrade head` (incluida la 118 tabular_*): el
    # worker espera a que esté healthy para no consumir jobs Excel/CSV antes
    # de que existan las tablas tabulares.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Parser Lab (Fase 2) — benchmark shadow one-shot sobre la imagen worker.
  # Uso: docker compose -f docker-compose.prod.yml --profile parser-lab run --rm parser-lab
  # ===========================================================================
  parser-lab:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: worker
    profiles: ["parser-lab"]
    command:
      - python
      - -m
      - src.scripts.parser_shadow_benchmark
      - /corpus
      - --out
      - /reports
    volumes:
      - ${PARSER_LAB_CORPUS:-./data/corpus}:/corpus:ro
      - ${PARSER_LAB_REPORTS:-./data/reports/parser_shadow}:/reports
    env_file:
      - path: .env
        required: false
    environment:
      <<: *prod-env
      RAG_ODL_JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      JAVA_TOOL_OPTIONS: ${PARSER_LAB_JAVA_OPTS:--Xmx1g}
    healthcheck:
      disable: true
    restart: "no"

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"

volumes:
  uploads_data:
    # Prefer S3-compatible storage for file sources; this volume is a last resort.
    # See docs/platform/PRODUCTION.md
