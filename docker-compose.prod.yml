  RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_QUALITY_WEIGHT:-0.40}
  RAG_RUNTIME_EFFICIENCY_COST_WEIGHT: ${RAG_RUNTIME_EFFICIENCY_COST_WEIGHT:-0.25}
