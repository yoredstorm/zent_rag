  RAG_RAG_CONTEXT_TOOL_RESERVE: ${RAG_RAG_CONTEXT_TOOL_RESERVE:-1500}
  RAG_RAG_CONTEXT_SAFETY_MARGIN: ${RAG_RAG_CONTEXT_SAFETY_MARGIN:-2048}
  RAG_RAG_LONG_CONTEXT_TIERS: ${RAG_RAG_LONG_CONTEXT_TIERS:-4096,8192,16384,32768,65536,131072,262144,524288}
  RAG_RAG_LONG_CONTEXT_MAX_TIER: ${RAG_RAG_LONG_CONTEXT_MAX_TIER:-7}
  RAG_RAG_LONG_CONTEXT_MAX_EXPANSIONS: ${RAG_RAG_LONG_CONTEXT_MAX_EXPANSIONS:-6}
  RAG_RAG_LONG_CONTEXT_GAIN_MIN: ${RAG_RAG_LONG_CONTEXT_GAIN_MIN:-0.04}
  RAG_RAG_LONG_CONTEXT_REQUIREMENT_MIN: ${RAG_RAG_LONG_CONTEXT_REQUIREMENT_MIN:-0.6}
