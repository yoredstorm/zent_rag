apiVersion: v1
kind: ConfigMap
metadata:
  name: zent-config
  labels:
    app.kubernetes.io/name: zent
data:
  RAG_ENVIRONMENT: "production"
  RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_POSTGRES_HOST: "REPLACE_MANAGED_POSTGRES_HOST"
  RAG_POSTGRES_PORT: "5432"
  RAG_POSTGRES_USER: "rag_user"
  RAG_POSTGRES_DB: "rag_platform"
  RAG_QDRANT_HOST: "REPLACE_MANAGED_QDRANT_HOST"
  RAG_QDRANT_PORT: "6333"
  RAG_LITELLM_API_BASE: "https://api.example.com/v1"
  RAG_LITELLM_DEFAULT_MODEL: "gpt-4o-mini"
  RAG_EMBEDDING_MODEL: "openai/baai/bge-m3"
  RAG_CORS_ALLOWED_ORIGINS: "https://app.example.com"
  RAG_UPLOAD_DIR: "/app/uploads"
