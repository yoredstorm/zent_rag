apiVersion: v1
kind: ConfigMap
metadata:
  name: zent-config
  labels:
    app.kubernetes.io/name: zent
data:
  RAG_ENVIRONMENT: "production"
  RAG_ADMIN_ENABLED: "false"
  RAG_SEED_DEMO_DATA: "false"
  RAG_MANAGED_DB_PROVIDER: "local"
  RAG_POSTGRES_HOST: "REPLACE_MANAGED_POSTGRES_HOST"
  RAG_POSTGRES_PORT: "5432"
  RAG_POSTGRES_USER: "rag_user"
  RAG_POSTGRES_DB: "rag_platform"
  RAG_QDRANT_HOST: "REPLACE_MANAGED_QDRANT_HOST"
  RAG_QDRANT_PORT: "6333"
  RAG_LITELLM_API_BASE: "https://api.example.com/v1"
  RAG_LITELLM_DEFAULT_MODEL: "gpt-4o-mini"
  RAG_EMBEDDING_MODEL: "openai/baai/bge-m3"
  RAG_CORS_ALLOWED_ORIGINS: "https://app.example.com"
  RAG_UPLOAD_DIR: "/app/uploads"
  # Knowledge V2 (StructuredDocument) — OFF por ADR hasta calibrar shadow.
  RAG_KNOWLEDGE_V2_ENABLED: "false"
  RAG_KNOWLEDGE_V2_SHADOW: "false"
  RAG_KNOWLEDGE_V2_PROMOTE: "false"
  RAG_KNOWLEDGE_SUMMARY_MODE: "off"
  # Knowledge Tabular V2 (Excel/CSV): inerte sin RAG_KNOWLEDGE_V2_ENABLED.
  RAG_KNOWLEDGE_TABULAR_ENABLED: "true"
  RAG_KNOWLEDGE_TABULAR_MAX_WORKBOOK_BYTES: "52428800"
  RAG_KNOWLEDGE_TABULAR_MAX_SHEETS: "50"
  RAG_KNOWLEDGE_TABULAR_MAX_ROWS_PER_SHEET: "100000"
  RAG_KNOWLEDGE_TABULAR_MAX_COLUMNS: "512"
  RAG_KNOWLEDGE_TABULAR_MAX_CELLS: "2000000"
  RAG_KNOWLEDGE_TABULAR_MAX_EMBEDDING_ROWS: "5000"
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_SIZE: "20"
  RAG_KNOWLEDGE_TABULAR_ROW_GROUP_OVERLAP: "2"
  RAG_KNOWLEDGE_TABULAR_CELL_CHUNKS_ENABLED: "false"
  RAG_KNOWLEDGE_TABULAR_MAX_CELL_CHUNKS: "200"
  RAG_KNOWLEDGE_TABULAR_MANAGED_DB_ENABLED: "false"
  RAG_KNOWLEDGE_TABULAR_SQL_FIRST: "true"
  RAG_KNOWLEDGE_TABULAR_LAZY_ENABLED: "true"
  RAG_KNOWLEDGE_TABULAR_LOOKUP_MAX_ROWS: "1000"
  RAG_KNOWLEDGE_TABULAR_SQL_MIN_CONFIDENCE: "0.7"
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_ROWS: "5000"
  RAG_KNOWLEDGE_TABULAR_LAZY_TIMEOUT_SECONDS: "15"
  RAG_KNOWLEDGE_TABULAR_LAZY_MAX_SOURCES: "3"
  RAG_SEARCH_KNOWLEDGE_TIMEOUT_SECONDS: "20"
  # Decision Engine batching + Judgment Fabric (ADRs decision-engine-batching.md,
  # judgment-fabric.md). Defaults seguros: sin batching y target explícito.
  RAG_DECISION_BATCH_MODE: "off"
  RAG_DECISION_PASSAGE_JUDGE: "true"
  RAG_DECISION_PASSAGE_MAX: "5"
  RAG_DECISION_CLAIMS: "true"
  RAG_DECISION_CLAIMS_MAX: "6"
  RAG_DECISION_CLAIMS_LEDGER: "true"
  RAG_DECISION_JUDGMENT_CACHE_TTL_SECONDS: "120"
  # JEV Preflight (docs/architecture/jev-preflight.md). Default off: sin juicio previo.
  RAG_JEV_PREFLIGHT_MODE: "off"
  RAG_JEV_PREFLIGHT_CANARY_PERCENTAGE: "0"
  RAG_JEV_PREFLIGHT_ENFORCE: "true"
  RAG_JEV_PREFLIGHT_STRICT_THRESHOLDS: "0.75"
  RAG_JEV_PREFLIGHT_NEXT_ACTION_CHOICE: "0.80"
  RAG_JEV_PREFLIGHT_ALLOW_DETERMINISTIC_ANSWER: "false"
  RAG_JEV_PREFLIGHT_ALLOW_SMALL_TIER: "true"
  RAG_JEV_PREFLIGHT_EXTRA_RETRIEVAL: "true"
  RAG_JEV_PREFLIGHT_REASONING_FIRST: "true"
  # Response Intelligence: como se explica la respuesta (forma, no contenido).
  RAG_RESPONSE_INTELLIGENCE_MODE: "rules"
  RAG_RESPONSE_INTELLIGENCE_CANARY_PERCENTAGE: "0"
  RAG_RESPONSE_PRESENTATION_GATE: "true"
  RAG_DECISION_TARGET_SELECTION: "off"
  RAG_DECISION_RISK_MAX_SELECTABLE: "high"
  RAG_DECISION_RISK_LOW_CHOICE: "0.60"
  RAG_DECISION_RISK_MEDIUM_CHOICE: "0.70"
  RAG_DECISION_RISK_HIGH_CHOICE: "0.80"
  RAG_DECISION_RISK_CRITICAL_CHOICE: "0.90"
  RAG_DECISION_RISK_HIGH_WARRANT_REQUIRED: "true"
  RAG_DECISION_RISK_CRITICAL_WARRANT_REQUIRED: "true"
  RAG_DECISION_RISK_HIGH_WARRANT: "0.65"
  RAG_DECISION_RISK_CRITICAL_WARRANT: "0.75"
  RAG_DECISION_RISK_LOW_FALLBACK: "respond_directly"
  RAG_DECISION_RISK_MEDIUM_FALLBACK: "ask_clarification"
  RAG_DECISION_RISK_HIGH_FALLBACK: "human_review"
  RAG_DECISION_RISK_CRITICAL_FALLBACK: "human_review"
