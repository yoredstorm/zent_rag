apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zent-default
  labels:
    app.kubernetes.io/name: zent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - {}
