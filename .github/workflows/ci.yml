name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ sdk/python

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit prod extras (HIGH+)
        run: |
          pip install -e ".[prod]" pip-audit
          # --skip-editable: el proyecto editable (rag-as-a-service) no está en PyPI.
          pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: changeme_in_production
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_BILLING_ENABLED: "false"
      RAG_ENVIRONMENT: development
      # Default de gateway distinto de gpt-4o-mini: test_model_budgets_blocking
      # exige que el fallback default no sea el modelo bloqueado por presupuesto.
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      # Required — no insecure default allowed in Settings
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Same as Dockerfile.api (PYTHONPATH=/app). Alembic imports src.core.config.
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=changeme_in_production
          # Baseline scripts only (01–31). Incremental schema (Alembic 002+,
          # e.g. organizations.primary_region_id) is applied after pip via
          # `alembic upgrade head`, matching Dockerfile.api / docker compose.
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            psql -h localhost -U rag_user -d rag_platform -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in src/infrastructure/db_init/seed-demo/farmacia/*.sql; do
            psql -h localhost -U rag_user -d rag_platform -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed dev key (CI-only, mirrors 07-dev-seed.sh)
        run: |
          PGPASSWORD=changeme_in_production psql -h localhost -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps
        run: pip install -e ".[prod,dev]"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60 -x

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk/python pytest pytest-asyncio respx
      - run: pytest sdk/python/tests -q

  sdk-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: sdk/node

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: Render manifests (no cluster)
        run: kustomize build deploy/k8s

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, sdk-python, sdk-node]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
