name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Un push nuevo al mismo PR cancela el run anterior: no compite por runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos minimos: el workflow solo lee el repositorio. Los jobs que suben
# SARIF (gitleaks) declaran el permiso adicional a nivel de job.
permissions:
  contents: read

env:
  # Unica fuente del numero de shards de pytest. La matriz de abajo lo repite
  # como literal porque `strategy.matrix` no acepta el contexto `env`; el paso
  # de merge lo recibe por `--splits ${{ env.PYTEST_SHARDS }}`.
  PYTEST_SHARDS: "6"

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv (versión fijada)
        run: python -m pip install "uv==0.12.13"
      - name: Lock alineado con pyproject (frozen)
        run: uv lock --check
      - name: Toolchain desde el lock (frozen)
        run: uv sync --frozen --extra dev
      - run: uv run --frozen --no-sync ruff check src/ tests/ sdk/python
      - name: Dashboard de producción actualizado (dashboards-as-code)
        # El JSON se genera: si el generador cambió, el artifact debe cambiar.
        run: uv run --frozen --no-sync python -m src.scripts.observability_assets --check

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit prod extras (HIGH+)
        run: |
          pip install -e ".[prod]" pip-audit
          # setuptools del runner tenía PYSEC-2026-3447 (fix 83.0.0).
          pip install -q -U setuptools
          # --skip-editable: el proyecto editable (rag-as-a-service) no está en PyPI.
          pip-audit --skip-editable

  test-shard:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: zent_ci_password
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_BILLING_ENABLED: "false"
      RAG_ENVIRONMENT: development
      RAG_SEED_DEMO_DATA: "true"
      # Default de gateway distinto de gpt-4o-mini: test_model_budgets_blocking
      # exige que el fallback default no sea el modelo bloqueado por presupuesto.
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      # Required — no insecure default allowed in Settings
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Same as Dockerfile.api (PYTHONPATH=/app). Alembic imports src.core.config.
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: zent_ci_password
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          # psql del contenedor: evita `apt-get update/install` por job y usa
          # exactamente el cliente de la misma version que el servidor.
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform \
              -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Seed dev key (CI-only, mirrors 07-dev-seed.sh)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps (lock reproducible)
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra prod --extra dev

      - name: Apply Alembic migrations
        run: uv run --frozen --no-sync alembic upgrade head

      - name: Architecture invariants (fast, required)
        if: matrix.shard == 1
        env:
          CI_NODE_MANIFEST: artifacts/nodeids-invariants.txt
        run: |
          # Invariantes de arquitectura y contratos: rápido y obligatorio en PR.
          # Un fallo acá es un cambio de contrato, no un test flaky.
          set -o pipefail
          uv run --frozen --no-sync pytest \
            tests/test_architecture.py \
            tests/test_suite_hermeticity.py \
            tests/test_authority_ownership.py \
            tests/test_authorization_matrix.py \
            tests/test_closure_authority.py \
            tests/test_config_rules.py \
            tests/test_cost_authority.py \
            tests/test_decision_state_inflight.py \
            tests/test_evidence_semantics.py \
            tests/test_action_plane_authority.py \
            tests/test_flag_coherence.py \
            tests/test_safety_floor.py \
            tests/test_run_guards_classification.py \
            tests/test_terminal_transitions_allowlist.py \
            tests/test_reason_codes.py \
            tests/test_failure_taxonomy.py \
            tests/test_adaptive_projection.py \
            tests/test_finalization_policy.py \
            tests/test_finalization_enforcement_scopes.py \
            tests/test_finalization_golden.py \
            tests/test_run_guards_shadow.py \
            tests/test_prompt_assembly.py \
            tests/test_prompt_block_headers.py \
            tests/test_conversation_isolation.py \
            tests/test_run_accounting.py \
            tests/test_run_accounting_rag.py \
            tests/test_provider_attempts.py \
            tests/test_run_metrics.py \
            tests/test_run_state.py \
            tests/test_openapi_contract.py \
            tests/test_db_lifecycle.py \
            tests/test_chaos_resilience.py \
            tests/test_flags_inventory.py \
            tests/test_exception_certification.py \
            -q --no-header --junitxml=artifacts/junit-invariants.xml 2>&1 | tee /tmp/invariants.log

      - name: Annotate invariant failure
        if: failure() && matrix.shard == 1
        run: |
          if [ -f /tmp/invariants.log ]; then
            grep -E "^(FAILED|ERROR) " /tmp/invariants.log | head -n 5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Run tests (shard ${{ matrix.shard }}/6)
        env:
          CI_NODE_MANIFEST: artifacts/nodeids-shard-${{ matrix.shard }}.txt
        run: |
          set -o pipefail
          # PR: fail-fast (-x) para feedback corto. Push a master: cada shard
          # corre sin -x y reporta todos sus fallos.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            XFLAG="-x"
          else
            XFLAG=""
          fi
          # Los tests de invariantes ya corrieron arriba (junit-invariants.xml).
          # El planner asigna archivos completos: preserva fixtures de modulo y
          # dependencias internas del archivo, y evita que un test se ejecute
          # dos veces. La lista de invariantes se deriva del propio paso.
          uv run --frozen --no-sync python scripts/cert/run_invariants.py --list-ignores \
            | sed 's/^--ignore=//' > /tmp/invariant-files.txt
          mapfile -t TEST_FILES < <(uv run --frozen --no-sync \
            python scripts/ci/shard_plan.py \
              --splits 6 --group ${{ matrix.shard }} \
              --durations-path .test_durations \
              --exclude-file /tmp/invariant-files.txt \
              --exclude-dir tests/certification/workflows)
          echo "shard ${{ matrix.shard }}/6 files=${#TEST_FILES[@]}"
          uv run --frozen --no-sync pytest "${TEST_FILES[@]}" \
            -q --tb=short --timeout=300 \
            $XFLAG --junitxml=artifacts/junit-tests-shard-${{ matrix.shard }}.xml \
            2>&1 | tee /tmp/pytest-shard-${{ matrix.shard }}.log

      - name: Annotate test failure
        if: failure()
        run: |
          # Los logs requieren auth: deja el primer fallo como annotation.
          LOG=/tmp/pytest-shard-${{ matrix.shard }}.log
          {
            grep -E "^(FAILED|ERROR) " "$LOG" | tail -n 3 || true
            grep -E "^E   " "$LOG" | head -n 3 || true
          } | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-220)"
          done

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ci-shard-${{ matrix.shard }}
          path: |
            artifacts/junit-*.xml
            artifacts/nodeids-*.txt
          if-no-files-found: ignore

  certification:
    name: certification
    runs-on: ubuntu-latest
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: zent_ci_password
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_BILLING_ENABLED: "false"
      RAG_ENVIRONMENT: development
      RAG_SEED_DEMO_DATA: "true"
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: zent_ci_password
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform \
              -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Seed dev key (CI-only, mirrors 07-dev-seed.sh)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps (lock reproducible)
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra prod --extra dev

      - name: Apply Alembic migrations
        run: uv run --frozen --no-sync alembic upgrade head

      - name: Certification — Gold Workflow (Retail Sales Funnel)
        # Benchmark arquitectónico permanente: conversación → workflow durable →
        # datos reales → carrito → WAIT/RESUME → pago verificado → venta →
        # inventario → cierre, más portabilidad e idempotencia de extremo a extremo.
        run: |
          set -o pipefail
          uv run --frozen --no-sync pytest tests/certification/workflows \
            -v --tb=short --timeout=900 \
            --junitxml=artifacts/junit-certification-workflows.xml 2>&1 | tee /tmp/certification.log

      - name: Annotate certification failure
        if: failure()
        run: |
          if [ -f /tmp/certification.log ]; then
            grep -E "^(FAILED|ERROR) " /tmp/certification.log | head -n 5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-certification
          path: artifacts/junit-*.xml
          if-no-files-found: ignore

  # Fusiona los JUnit de los 6 shards en el artifact historico `junit-ci`.
  # `scripts/cert/fetch_ci_evidence.py` sigue extrayendo junit-tests.xml y
  # junit-invariants.xml sin cambios.
  test-evidence:
    name: test-evidence
    needs: [test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download shard JUnit
        uses: actions/download-artifact@v4
        with:
          pattern: junit-ci-shard-*
          path: artifacts/shards
          merge-multiple: true
      - name: Merge shard JUnit
        run: |
          python scripts/cert/merge_junit_shards.py \
            --input-dir artifacts/shards \
            --splits "${PYTEST_SHARDS}" \
            --invariants artifacts/shards/junit-invariants.xml \
            --out artifacts/junit-tests.xml
      - name: Verify JUnit covers the full collection
        run: |
          python scripts/cert/verify_junit_coverage.py \
            --junit artifacts/junit-tests.xml \
            --manifests-dir artifacts/shards \
            --splits "${PYTEST_SHARDS}"
      - name: Upload certification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ci
          path: |
            artifacts/junit-tests.xml
            artifacts/shards/junit-invariants.xml
          if-no-files-found: error
      - name: Preserve shard evidence on merge failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ci-merge-failure
          path: artifacts/shards/**
          if-no-files-found: ignore

  # Gate obligatorio con el nombre `test`: conserva el required check de
  # branch protection y se ejecuta aunque una dependencia falle u omita, para
  # evaluar TODOS los resultados y no solo el primero.
  test:
    name: test
    needs:
      - test-shard
      - certification
      - test-evidence
      - lint
      - pip-audit
      - secrets-scan
      - sdk-python
      - sdk-node
      - portal
      - portal-e2e
      - kustomize
      - build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality gate
        env:
          SHARDS: ${{ needs.test-shard.result }}
          CERTIFICATION: ${{ needs.certification.result }}
          EVIDENCE: ${{ needs.test-evidence.result }}
          LINT: ${{ needs.lint.result }}
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          SECRETS_SCAN: ${{ needs.secrets-scan.result }}
          SDK_PYTHON: ${{ needs.sdk-python.result }}
          SDK_NODE: ${{ needs.sdk-node.result }}
          PORTAL: ${{ needs.portal.result }}
          PORTAL_E2E: ${{ needs.portal-e2e.result }}
          KUSTOMIZE: ${{ needs.kustomize.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -uo pipefail
          status=0
          for pair in \
            "test-shard=$SHARDS" \
            "certification=$CERTIFICATION" \
            "test-evidence=$EVIDENCE" \
            "lint=$LINT" \
            "pip-audit=$PIP_AUDIT" \
            "secrets-scan=$SECRETS_SCAN" \
            "sdk-python=$SDK_PYTHON" \
            "sdk-node=$SDK_NODE" \
            "portal=$PORTAL" \
            "portal-e2e=$PORTAL_E2E" \
            "kustomize=$KUSTOMIZE" \
            "build=$BUILD"; do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name=$result"
            if [ "$result" != "success" ]; then
              echo "::error::quality gate '$name' no termino en success ($result)"
              status=1
            fi
          done
          exit "$status"

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk/python pytest pytest-asyncio respx
      - run: pytest sdk/python/tests -q

  sdk-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: sdk/node

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  portal-e2e-shard:
    name: portal-e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: zent_ci_password
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_ENVIRONMENT: development
      RAG_SEED_DEMO_DATA: "true"
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RAG_PORTAL_DEV_EMAIL: demo@zenttech.com
      RAG_PORTAL_DEV_PASSWORD: demo-password-change-me
      RAG_PLATFORM_ADMIN_EMAIL: admin@zent.dev
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: zent_ci_password
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('portal/package-lock.json') }}

      - name: Init DB schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform \
              -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Seed dev key (mirrors 07-dev-seed.sh)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps (lock reproducible)
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra prod --extra dev

      - name: Apply Alembic migrations
        run: uv run --frozen --no-sync alembic upgrade head

      - name: Start API
        run: |
          nohup uv run --frozen --no-sync uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Portal deps + browsers
        working-directory: portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E (shard ${{ matrix.shard }}/2, smoke + axe)
        working-directory: portal
        run: |
          set -o pipefail
          npx playwright test --shard=${{ matrix.shard }}/2 2>&1 | tee /tmp/e2e.log

      - name: Annotate E2E failures
        if: failure()
        run: |
          # Los logs requieren auth: deja los tests fallidos como annotations.
          {
            grep -E "^\s+[0-9]+\) \[chromium\]" /tmp/e2e.log | head -n 6 || true
            grep -E "Error: |expect\(|Received|Expected|Locator: |at .*spec\.ts" /tmp/e2e.log | head -n 10 || true
            tail -n 6 /tmp/e2e.log || true
          } | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-220)"
          done

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e-diagnostics-${{ matrix.shard }}
          path: |
            portal/test-results
            /tmp/e2e.log
            /tmp/api.log
          if-no-files-found: ignore

  # Agregador con el nombre historico `portal-e2e`: si cualquiera de los dos
  # shards falla u omite, este check falla y el gate `test` bloquea el merge.
  portal-e2e:
    name: portal-e2e
    needs: [portal-e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both E2E shards
        env:
          E2E_RESULT: ${{ needs.portal-e2e-shard.result }}
        run: |
          echo "portal-e2e-shard=$E2E_RESULT"
          test "$E2E_RESULT" = "success"

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: Render manifests (no cluster)
        run: kustomize build deploy/k8s

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La imagen se construye en paralelo con los tests: `push: false`, no se
    # publica ni se despliega. El gate `test` exige que build y SBOM terminen
    # en success antes de autorizar el release.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (CycloneDX) de los artifacts desplegables
        # Sin dependencias nuevas: lee uv.lock + package-lock.json.
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra dev
          uv run --frozen --no-sync python -m src.scripts.sbom --out artifacts/release/sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/release/sbom.json
          if-no-files-found: error
