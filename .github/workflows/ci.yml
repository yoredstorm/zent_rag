name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in src/infrastructure/db_init/0*.sql; do
            PGPASSWORD=changeme_in_production psql -h localhost -U rag_user -d rag_platform -f "$f"
          done

      - name: Seed dev token (CI-only, mirrors 07-dev-seed.sh)
        run: |
          PGPASSWORD=changeme_in_production psql -h localhost -U rag_user -d rag_platform -c "INSERT INTO api_tokens (id, subscription_id, token_hash, token_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM subscriptions WHERE id='20000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_tokens WHERE subscription_id='20000000-0000-0000-0000-000000000001');"

      - name: Install deps
        run: pip install -e ".[prod,dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60 -x
        env:
          RAG_POSTGRES_HOST: localhost
          RAG_POSTGRES_PORT: "5432"
          RAG_POSTGRES_USER: rag_user
          RAG_POSTGRES_PASSWORD: changeme_in_production
          RAG_POSTGRES_DB: rag_platform
          RAG_REDIS_URL: redis://localhost:6379/0
          RAG_QDRANT_HOST: localhost
          RAG_QDRANT_PORT: "6333"
          RAG_BILLING_ENABLED: "false"
          RAG_ENVIRONMENT: development
          # Required — no insecure default allowed in Settings
          RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
