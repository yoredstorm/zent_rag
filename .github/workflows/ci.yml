name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: changeme_in_production
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in src/infrastructure/db_init/0*.sql; do
            PGPASSWORD=changeme_in_production psql -h localhost -U rag_user -d rag_platform -f "$f"
          done

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60 -x
        env:
          RAG_POSTGRES_HOST: localhost
          RAG_POSTGRES_PORT: "5432"
          RAG_POSTGRES_USER: rag_user
          RAG_POSTGRES_PASSWORD: changeme_in_production
          RAG_POSTGRES_DB: rag_platform
          RAG_REDIS_URL: redis://localhost:6379/0
          RAG_QDRANT_HOST: localhost
          RAG_QDRANT_PORT: "6333"
          RAG_BILLING_ENABLED: "false"
          RAG_ENVIRONMENT: ci

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
