name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv (versión fijada)
        run: python -m pip install "uv==0.12.13"
      - name: Lock alineado con pyproject (frozen)
        run: uv lock --check
      - name: Toolchain desde el lock (frozen)
        run: uv sync --frozen --extra dev
      - run: uv run --frozen --no-sync ruff check src/ tests/ sdk/python
      - name: Dashboard de producción actualizado (dashboards-as-code)
        # El JSON se genera: si el generador cambió, el artifact debe cambiar.
        run: uv run --frozen --no-sync python -m src.scripts.observability_assets --check

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit prod extras (HIGH+)
        run: |
          pip install -e ".[prod]" pip-audit
          # setuptools del runner tenía PYSEC-2026-3447 (fix 83.0.0).
          pip install -q -U setuptools
          # --skip-editable: el proyecto editable (rag-as-a-service) no está en PyPI.
          pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: zent_ci_password
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_BILLING_ENABLED: "false"
      RAG_ENVIRONMENT: development
      RAG_SEED_DEMO_DATA: "true"
      # Default de gateway distinto de gpt-4o-mini: test_model_budgets_blocking
      # exige que el fallback default no sea el modelo bloqueado por presupuesto.
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      # Required — no insecure default allowed in Settings
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Same as Dockerfile.api (PYTHONPATH=/app). Alembic imports src.core.config.
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: zent_ci_password
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init DB schema
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=zent_ci_password
          # Baseline scripts only (01–31). Incremental schema (Alembic 002+,
          # e.g. organizations.primary_region_id) is applied after uv sync via
          # `alembic upgrade head`, matching Dockerfile.api / docker compose.
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            psql -h localhost -U rag_user -d rag_platform -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed dev key (CI-only, mirrors 07-dev-seed.sh)
        run: |
          PGPASSWORD=zent_ci_password psql -h localhost -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps (lock reproducible)
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra prod --extra dev

      - name: Apply Alembic migrations
        run: uv run --frozen --no-sync alembic upgrade head

      - name: Architecture invariants (fast, required)
        run: |
          # Invariantes de arquitectura y contratos: rápido y obligatorio en PR.
          # Un fallo acá es un cambio de contrato, no un test flaky.
          set -o pipefail
          uv run --frozen --no-sync pytest \
            tests/test_architecture.py \
            tests/test_authority_ownership.py \
            tests/test_authorization_matrix.py \
            tests/test_closure_authority.py \
            tests/test_config_rules.py \
            tests/test_cost_authority.py \
            tests/test_decision_state_inflight.py \
            tests/test_evidence_semantics.py \
            tests/test_action_plane_authority.py \
            tests/test_flag_coherence.py \
            tests/test_safety_floor.py \
            tests/test_run_guards_classification.py \
            tests/test_terminal_transitions_allowlist.py \
            tests/test_reason_codes.py \
            tests/test_failure_taxonomy.py \
            tests/test_adaptive_projection.py \
            tests/test_finalization_policy.py \
            tests/test_finalization_enforcement_scopes.py \
            tests/test_finalization_golden.py \
            tests/test_run_guards_shadow.py \
            tests/test_prompt_assembly.py \
            tests/test_prompt_block_headers.py \
            tests/test_conversation_isolation.py \
            tests/test_run_accounting.py \
            tests/test_run_accounting_rag.py \
            tests/test_provider_attempts.py \
            tests/test_run_metrics.py \
            tests/test_run_state.py \
            tests/test_openapi_contract.py \
            tests/test_db_lifecycle.py \
            tests/test_chaos_resilience.py \
            tests/test_flags_inventory.py \
            tests/test_exception_certification.py \
            -q --no-header --junitxml=artifacts/junit-invariants.xml 2>&1 | tee /tmp/invariants.log

      - name: Annotate invariant failure
        if: failure()
        run: |
          if [ -f /tmp/invariants.log ]; then
            grep -E "^(FAILED|ERROR) " /tmp/invariants.log | head -n 5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Run tests
        run: |
          set -o pipefail
          # PR: fail-fast (-x) para feedback corto. Push a master: suite completa
          # sin -x — todos los fallos visibles sobre el mismo SHA.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            XFLAG="-x"
          else
            XFLAG=""
          fi
          uv run --frozen --no-sync pytest tests/ -v --tb=short --timeout=300 $XFLAG \
            --junitxml=artifacts/junit-tests.xml 2>&1 | tee /tmp/pytest.log

      - name: Annotate test failure
        if: failure()
        run: |
          # Los logs requieren auth: deja el primer fallo como annotation.
          {
            grep -E "^_{3,} .* _{3,}$" /tmp/pytest.log | tail -n 2 || true
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | tail -n 3 || true
            grep -E "^E   " /tmp/pytest.log | head -n 3 || true
          } | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-220)"
          done

      - name: Upload JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ci
          path: artifacts/junit-*.xml
          if-no-files-found: ignore

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk/python pytest pytest-asyncio respx
      - run: pytest sdk/python/tests -q

  sdk-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: sdk/node

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  portal-e2e:
    runs-on: ubuntu-latest
    env:
      RAG_POSTGRES_HOST: localhost
      RAG_POSTGRES_PORT: "5432"
      RAG_POSTGRES_USER: rag_user
      RAG_POSTGRES_PASSWORD: zent_ci_password
      RAG_POSTGRES_DB: rag_platform
      RAG_REDIS_URL: redis://localhost:6379/0
      RAG_QDRANT_HOST: localhost
      RAG_QDRANT_PORT: "6333"
      RAG_ENVIRONMENT: development
      RAG_SEED_DEMO_DATA: "true"
      RAG_LITELLM_DEFAULT_MODEL: gpt-4o
      RAG_PORTAL_SESSION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RAG_PORTAL_DEV_EMAIL: demo@zenttech.com
      RAG_PORTAL_DEV_PASSWORD: demo-password-change-me
      RAG_PLATFORM_ADMIN_EMAIL: admin@zent.dev
      PYTHONPATH: ${{ github.workspace }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: zent_ci_password
          POSTGRES_DB: rag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Init DB schema
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=zent_ci_password
          for f in src/infrastructure/db_init/[0-9][0-9]-*.sql; do
            psql -h localhost -U rag_user -d rag_platform -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed dev key (mirrors 07-dev-seed.sh)
        run: |
          PGPASSWORD=zent_ci_password psql -h localhost -U rag_user -d rag_platform -c "INSERT INTO api_keys (id, organization_id, key_hash, key_prefix, name, scopes) SELECT '30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001',encode(sha256('rag_test_dev_token_for_local_testing_123'::bytea),'hex'),'rag_test_','Dev Token','[\"rag:query\",\"rag:ingest\",\"admin:*\"]'::jsonb WHERE EXISTS (SELECT 1 FROM organizations WHERE id='00000000-0000-0000-0000-000000000001') AND NOT EXISTS (SELECT 1 FROM api_keys WHERE organization_id='00000000-0000-0000-0000-000000000001');"

      - name: Install deps (lock reproducible)
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra prod --extra dev

      - name: Apply Alembic migrations
        run: uv run --frozen --no-sync alembic upgrade head

      - name: Start API
        run: |
          nohup uv run --frozen --no-sync uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Portal deps + browsers
        working-directory: portal
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E (smoke + axe)
        working-directory: portal
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/e2e.log

      - name: Annotate E2E failures
        if: failure()
        run: |
          # Los logs requieren auth: deja los tests fallidos como annotations.
          {
            grep -E "^\s+[0-9]+\) \[chromium\]" /tmp/e2e.log | head -n 6 || true
            grep -E "Error: |expect\(|Received|Expected|Locator: |at .*spec\.ts" /tmp/e2e.log | head -n 10 || true
            tail -n 6 /tmp/e2e.log || true
          } | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-220)"
          done

      - name: Upload API log on failure
        if: failure()
        run: cat /tmp/api.log || true

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: Render manifests (no cluster)
        run: kustomize build deploy/k8s

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, sdk-python, sdk-node, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (CycloneDX) de los artifacts desplegables
        # Sin dependencias nuevas: lee uv.lock + package-lock.json.
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --frozen --extra dev
          uv run --frozen --no-sync python -m src.scripts.sbom --out artifacts/release/sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/release/sbom.json
          if-no-files-found: error
